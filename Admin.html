<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Administrativo</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f4f4;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

    }


    .topo {

      background: #111;

      color: white;

      padding: 22px;

      border-radius: 14px;

      margin-bottom: 20px;

    }


    .topo h1 {

      margin: 0 0 6px;

      font-size: 26px;

    }


    .topo p {

      margin: 0;

      color: #ccc;

      font-size: 14px;

    }


    .painel {

      background: white;

      border-radius: 14px;

      padding: 20px;

      box-shadow:
        0 2px 10px rgba(0,0,0,.08);

      margin-bottom: 20px;

    }


    .filtros {

      display: grid;

      grid-template-columns:
        1fr 1fr auto;

      gap: 15px;

      align-items: end;

    }


    .campo {

      display: flex;

      flex-direction: column;

      gap: 7px;

    }


    .campo label {

      font-size: 13px;

      font-weight: bold;

      color: #444;

    }


    .campo select,
    .campo input {

      width: 100%;

      height: 44px;

      padding: 0 12px;

      border: 1px solid #ccc;

      border-radius: 8px;

      background: white;

      font-size: 15px;

      outline: none;

    }


    .campo select:focus,
    .campo input:focus {

      border-color: #111;

    }


    button {

      height: 44px;

      border: none;

      border-radius: 8px;

      padding: 0 20px;

      background: #111;

      color: white;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #333;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    .status {

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      background: #f1f1f1;

      color: #555;

      font-size: 14px;

      display: none;

    }


    .status.mostrar {

      display: block;

    }


    .status.erro {

      background: #ffe5e5;

      color: #a00000;

    }


    .status.sucesso {

      background: #e5f8e8;

      color: #176b25;

    }


    .cabecalho-agenda {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 15px;

      flex-wrap: wrap;

    }


    .cabecalho-agenda h2 {

      margin: 0;

      font-size: 20px;

    }


    .contador {

      background: #111;

      color: white;

      border-radius: 20px;

      padding: 7px 13px;

      font-size: 13px;

    }


    .agenda {

      display: flex;

      flex-direction: column;

      gap: 10px;

    }


    .agendamento {

      display: grid;

      grid-template-columns:
        130px
        1fr
        1fr
        160px
        110px;

      gap: 15px;

      align-items: center;

      border: 1px solid #e5e5e5;

      border-radius: 10px;

      padding: 14px;

      background: #fff;

    }


    .horario {

      font-size: 16px;

      font-weight: bold;

      color: #111;

    }


    .cliente {

      font-weight: bold;

    }


    .servico {

      color: #555;

    }


    .telefone {

      color: #555;

      font-size: 14px;

    }


    .status-agendamento {

      text-align: center;

      background: #e7f6ea;

      color: #237b32;

      padding: 7px 8px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;

    }


    .vazio {

      text-align: center;

      padding: 40px 20px;

      color: #777;

      border: 1px dashed #ccc;

      border-radius: 10px;

      background: #fafafa;

    }


    .carregando {

      text-align: center;

      padding: 30px;

      color: #777;

    }


    .erro-tecnico {

      background: #fff0f0;

      border: 1px solid #ffbaba;

      color: #900;

      padding: 15px;

      border-radius: 10px;

      line-height: 1.5;

    }


    @media (max-width: 800px) {

      .filtros {

        grid-template-columns: 1fr;

      }


      button {

        width: 100%;

      }


      .agendamento {

        grid-template-columns: 1fr 1fr;

      }


      .horario {

        grid-column: 1 / -1;

      }

    }


    @media (max-width: 500px) {

      body {

        padding: 10px;

      }


      .painel {

        padding: 14px;

      }


      .agendamento {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="topo">

    <h1>
      Painel Administrativo
    </h1>

    <p>
      Gerenciamento de agendamentos da barbearia
    </p>

  </div>


  <div class="painel">

    <div class="filtros">


      <div class="campo">

        <label for="profissionalAdmin">
          Profissional
        </label>

        <select id="profissionalAdmin">

          <option value="">
            Carregando profissionais...
          </option>

        </select>

      </div>


      <div class="campo">

        <label for="dataAdmin">
          Data
        </label>

        <input
          type="date"
          id="dataAdmin"
        >

      </div>


      <div class="campo">

        <button
          type="button"
          id="btnCarregar"
        >
          Carregar agenda
        </button>

      </div>


    </div>


    <div
      id="mensagemAdmin"
      class="status"
    ></div>

  </div>


  <div class="painel">

    <div class="cabecalho-agenda">

      <h2>
        Agenda
      </h2>

      <div
        id="contadorAgenda"
        class="contador"
      >
        0 agendamentos
      </div>

    </div>


    <div
      id="agendaAdmin"
      class="agenda"
    >

      <div class="vazio">

        Selecione um profissional e uma data.

      </div>

    </div>

  </div>


</div>


<script>

/************************************************************
 * INICIALIZAÇÃO
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    inicializarAdmin();

  }
);


/************************************************************
 * INICIALIZAR
 ************************************************************/

function inicializarAdmin() {

  console.log(
    "ADMIN: inicializando..."
  );


  definirDataAtual();


  const botao =
    document.getElementById(
      "btnCarregar"
    );


  if (botao) {

    botao.addEventListener(
      "click",
      carregarAgendaAdmin
    );

  }


  carregarProfissionais();

}


/************************************************************
 * DATA ATUAL
 ************************************************************/

function definirDataAtual() {

  const campo =
    document.getElementById(
      "dataAdmin"
    );


  if (!campo) {
    return;
  }


  const hoje =
    new Date();


  const ano =
    hoje.getFullYear();


  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const dia =
    String(
      hoje.getDate()
    ).padStart(
      2,
      "0"
    );


  campo.value =
    ano +
    "-" +
    mes +
    "-" +
    dia;

}


/************************************************************
 * CARREGAR PROFISSIONAIS
 ************************************************************/

function carregarProfissionais() {

  const select =
    document.getElementById(
      "profissionalAdmin"
    );


  if (!select) {

    console.error(
      "ADMIN: select profissionalAdmin não encontrado."
    );

    return;

  }


  select.innerHTML =
    '<option value="">Carregando profissionais...</option>';


  mostrarMensagem(
    "Carregando profissionais...",
    false
  );


  /*
   * IMPORTANTE:
   *
   * Esta chamada só funciona quando o Admin.html
   * está sendo servido pelo Google Apps Script.
   */

  if (
    typeof google === "undefined" ||
    !google.script ||
    !google.script.run
  ) {

    mostrarErroTecnico(
      "Este Admin.html precisa ser aberto pela URL do Google Apps Script (/exec), e não pelo GitHub Pages."
    );


    select.innerHTML =
      '<option value="">Abra pelo Google Apps Script</option>';


    return;

  }


  google.script.run

    .withSuccessHandler(
      function(profissionais) {

        console.log(
          "ADMIN: profissionais recebidos:",
          profissionais
        );


        if (
          !Array.isArray(
            profissionais
          )
        ) {

          console.error(
            "Resposta inválida:",
            profissionais
          );


          select.innerHTML =
            '<option value="">Erro na resposta</option>';


          mostrarMensagem(
            "O servidor retornou uma resposta inválida para os profissionais.",
            true
          );


          return;

        }


        select.innerHTML =
          '<option value="">Selecione o profissional</option>';


        if (
          profissionais.length === 0
        ) {

          select.innerHTML =
            '<option value="">Nenhum profissional encontrado</option>';


          mostrarMensagem(
            "Nenhum profissional ativo foi encontrado na aba Profissionais.",
            true
          );


          return;

        }


        let quantidade =
          0;


        profissionais.forEach(
          function(profissional) {

            if (
              !profissional
            ) {
              return;
            }


            const nome =
              String(
                profissional.nome || ""
              ).trim();


            if (!nome) {
              return;
            }


            const option =
              document.createElement(
                "option"
              );


            option.value =
              nome;


            option.textContent =
              nome;


            select.appendChild(
              option
            );


            quantidade++;

          }
        );


        if (
          quantidade === 0
        ) {

          select.innerHTML =
            '<option value="">Nenhum profissional encontrado</option>';


          mostrarMensagem(
            "Os profissionais foram encontrados, mas nenhum possui nome válido.",
            true
          );


          return;

        }


        mostrarMensagem(
          quantidade +
          (
            quantidade === 1
              ? " profissional carregado."
              : " profissionais carregados."
          ),
          false
        );


        console.log(
          "ADMIN:",
          quantidade,
          "profissionais carregados."
        );

      }
    )

    .withFailureHandler(
      function(erro) {

        console.error(
          "ADMIN: erro getProfissionais:",
          erro
        );


        select.innerHTML =
          '<option value="">Erro ao carregar</option>';


        mostrarMensagem(
          obterMensagemErro(
            erro,
            "Não foi possível carregar os profissionais."
          ),
          true
        );

      }
    )

    .getProfissionais();

}


/************************************************************
 * CARREGAR AGENDA
 ************************************************************/

function carregarAgendaAdmin() {

  const select =
    document.getElementById(
      "profissionalAdmin"
    );


  const dataInput =
    document.getElementById(
      "dataAdmin"
    );


  const botao =
    document.getElementById(
      "btnCarregar"
    );


  const agenda =
    document.getElementById(
      "agendaAdmin"
    );


  if (!select || !dataInput) {

    mostrarMensagem(
      "Campos do filtro não encontrados.",
      true
    );


    return;

  }


  const profissional =
    String(
      select.value || ""
    ).trim();


  const data =
    String(
      dataInput.value || ""
    ).trim();


  if (!profissional) {

    mostrarMensagem(
      "Selecione um profissional.",
      true
    );


    return;

  }


  if (!data) {

    mostrarMensagem(
      "Data não informada.",
      true
    );


    return;

  }


  if (botao) {

    botao.disabled = true;

    botao.textContent =
      "Carregando...";

  }


  if (agenda) {

    agenda.innerHTML =
      '<div class="carregando">⏳ Carregando agenda...</div>';

  }


  mostrarMensagem(
    "Consultando agenda...",
    false
  );


  google.script.run

    .withSuccessHandler(
      function(resposta) {

        console.log(
          "ADMIN: resposta agenda:",
          resposta
        );


        if (botao) {

          botao.disabled = false;

          botao.textContent =
            "Carregar agenda";

        }


        if (!resposta) {

          renderizarAgendaAdmin(
            [],
            profissional,
            data
          );


          mostrarMensagem(
            "O servidor não retornou dados.",
            true
          );


          return;

        }


        if (
          resposta.sucesso !== true
        ) {

          renderizarAgendaAdmin(
            [],
            profissional,
            data
          );


          mostrarMensagem(
            resposta.mensagem ||
            "Erro ao carregar agenda.",
            true
          );


          return;

        }


        const agendamentos =
          Array.isArray(
            resposta.agendamentos
          )
            ? resposta.agendamentos
            : [];


        renderizarAgendaAdmin(
          agendamentos,
          profissional,
          data
        );


        mostrarMensagem(
          resposta.mensagem ||
          "Agenda carregada com sucesso.",
          false
        );

      }
    )

    .withFailureHandler(
      function(erro) {

        console.error(
          "ADMIN: erro obterAgendamentos:",
          erro
        );


        if (botao) {

          botao.disabled = false;

          botao.textContent =
            "Carregar agenda";

        }


        renderizarAgendaAdmin(
          [],
          profissional,
          data
        );


        mostrarMensagem(
          obterMensagemErro(
            erro,
            "Erro ao carregar agenda."
          ),
          true
        );

      }
    )

    .obterAgendamentos({

      profissional:
        profissional,

      data:
        data

    });

}


/************************************************************
 * RENDERIZAR AGENDA
 ************************************************************/

function renderizarAgendaAdmin(
  agendamentos,
  profissional,
  data
) {

  const elemento =
    document.getElementById(
      "agendaAdmin"
    );


  const contador =
    document.getElementById(
      "contadorAgenda"
    );


  if (!elemento) {
    return;
  }


  if (
    !Array.isArray(
      agendamentos
    )
  ) {

    agendamentos = [];

  }


  agendamentos.sort(
    function(a, b) {

      return converterHoraMinutos(
        a.horaInicio
      ) -
      converterHoraMinutos(
        b.horaInicio
      );

    }
  );


  if (contador) {

    contador.textContent =
      agendamentos.length +
      (
        agendamentos.length === 1
          ? " agendamento"
          : " agendamentos"
      );

  }


  if (
    agendamentos.length === 0
  ) {

    elemento.innerHTML = `

      <div class="vazio">

        <strong>
          Nenhum agendamento encontrado.
        </strong>

        <br><br>

        Profissional:
        <strong>
          ${escaparHtml(profissional)}
        </strong>

        <br>

        Data:
        <strong>
          ${escaparHtml(formatarDataBR(data))}
        </strong>

      </div>

    `;


    return;

  }


  elemento.innerHTML =
    agendamentos
      .map(
        function(agendamento) {

          const horaInicio =
            agendamento.horaInicio ||
            "";


          const horaFim =
            agendamento.horaFim ||
            "";


          const cliente =
            agendamento.cliente ||
            "Cliente não informado";


          const servico =
            agendamento.servico ||
            "Serviço não informado";


          const telefone =
            agendamento.telefone ||
            "";


          const status =
            agendamento.status ||
            "Agendado";


          return `

            <div class="agendamento">

              <div class="horario">

                ${escaparHtml(
                  horaInicio
                )}

                ${
                  horaFim
                    ? " - " +
                      escaparHtml(horaFim)
                    : ""
                }

              </div>


              <div class="cliente">

                ${escaparHtml(
                  cliente
                )}

              </div>


              <div class="servico">

                ${escaparHtml(
                  servico
                )}

              </div>


              <div class="telefone">

                ${escaparHtml(
                  telefone
                )}

              </div>


              <div class="status-agendamento">

                ${escaparHtml(
                  status
                )}

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/************************************************************
 * MENSAGEM
 ************************************************************/

function mostrarMensagem(
  mensagem,
  erro
) {

  const elemento =
    document.getElementById(
      "mensagemAdmin"
    );


  if (!elemento) {
    return;
  }


  elemento.textContent =
    mensagem || "";


  elemento.className =
    "status mostrar " +
    (
      erro
        ? "erro"
        : "sucesso"
    );

}


/************************************************************
 * ERRO TÉCNICO
 ************************************************************/

function mostrarErroTecnico(
  mensagem
) {

  const agenda =
    document.getElementById(
      "agendaAdmin"
    );


  if (agenda) {

    agenda.innerHTML = `

      <div class="erro-tecnico">

        <strong>
          Atenção
        </strong>

        <br><br>

        ${escaparHtml(mensagem)}

      </div>

    `;

  }


  mostrarMensagem(
    mensagem,
    true
  );

}


/************************************************************
 * MENSAGEM DE ERRO
 ************************************************************/

function obterMensagemErro(
  erro,
  padrao
) {

  if (
    erro &&
    erro.message
  ) {

    return String(
      erro.message
    );

  }


  if (
    typeof erro === "string"
  ) {

    return erro;

  }


  return padrao;

}


/************************************************************
 * ESCAPAR HTML
 ************************************************************/

function escaparHtml(
  valor
) {

  return String(
    valor === null ||
    typeof valor === "undefined"
      ? ""
      : valor
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/************************************************************
 * DATA BR
 ************************************************************/

function formatarDataBR(
  data
) {

  if (!data) {
    return "";
  }


  const partes =
    String(
      data
    ).split("-");


  if (
    partes.length !== 3
  ) {

    return String(
      data
    );

  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


/************************************************************
 * HORA PARA MINUTOS
 ************************************************************/

function converterHoraMinutos(
  hora
) {

  if (!hora) {
    return 9999;
  }


  const partes =
    String(
      hora
    ).split(":");


  if (
    partes.length < 2
  ) {

    return 9999;

  }


  const horas =
    Number(
      partes[0]
    );


  const minutos =
    Number(
      partes[1]
    );


  if (
    isNaN(horas) ||
    isNaN(minutos)
  ) {

    return 9999;

  }


  return (
    horas * 60 +
    minutos
  );

}


/************************************************************
 * ENTER
 ************************************************************/

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key !== "Enter"
    ) {

      return;

    }


    const alvo =
      event.target;


    if (
      alvo &&
      (
        alvo.id === "profissionalAdmin" ||
        alvo.id === "dataAdmin"
      )
    ) {

      carregarAgendaAdmin();

    }

  }
);

</script>


</body>

</html>
