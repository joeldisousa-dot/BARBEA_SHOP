<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel Administrativo - Barbearia</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f4f4f4;

      color:
        #222;

    }


    .container {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding: 25px 18px 50px;

    }


    .topo {

      background:
        #111;

      color:
        #fff;

      border-radius:
        14px;

      padding:
        22px;

      margin-bottom:
        20px;

      box-shadow:
        0 4px 15px rgba(0,0,0,0.10);

    }


    .topo h1 {

      margin:
        0 0 6px;

      font-size:
        26px;

    }


    .topo p {

      margin:
        0;

      color:
        #ccc;

      font-size:
        14px;

    }


    .painel {

      background:
        #fff;

      border-radius:
        14px;

      padding:
        20px;

      margin-bottom:
        20px;

      box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

    }


    .painel h2 {

      margin:
        0 0 18px;

      font-size:
        20px;

    }


    .filtros {

      display:
        grid;

      grid-template-columns:
        1fr 1fr auto;

      gap:
        15px;

      align-items:
        end;

    }


    .campo {

      display:
        flex;

      flex-direction:
        column;

      gap:
        7px;

    }


    .campo label {

      font-size:
        13px;

      font-weight:
        bold;

      color:
        #444;

    }


    .campo select,
    .campo input {

      width:
        100%;

      height:
        44px;

      padding:
        0 12px;

      border:
        1px solid #ccc;

      border-radius:
        8px;

      background:
        #fff;

      color:
        #222;

      font-size:
        15px;

      outline:
        none;

    }


    .campo select:focus,
    .campo input:focus {

      border-color:
        #111;

    }


    button {

      height:
        44px;

      border:
        none;

      border-radius:
        8px;

      padding:
        0 20px;

      background:
        #111;

      color:
        #fff;

      font-size:
        14px;

      font-weight:
        bold;

      cursor:
        pointer;

      transition:
        0.2s;

    }


    button:hover {

      background:
        #333;

    }


    button:disabled {

      opacity:
        0.5;

      cursor:
        not-allowed;

    }


    .mensagem {

      padding:
        14px;

      border-radius:
        8px;

      background:
        #f1f1f1;

      color:
        #555;

      font-size:
        14px;

      text-align:
        center;

    }


    .mensagem.erro {

      background:
        #ffe8e8;

      color:
        #a00000;

    }


    .mensagem.sucesso {

      background:
        #e7f8ec;

      color:
        #176b32;

    }


    .resumo {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        15px;

      flex-wrap:
        wrap;

    }


    .resumo-titulo {

      font-size:
        18px;

      font-weight:
        bold;

    }


    .resumo-data {

      color:
        #666;

      font-size:
        14px;

    }


    .contador {

      background:
        #111;

      color:
        #fff;

      padding:
        7px 12px;

      border-radius:
        20px;

      font-size:
        13px;

      font-weight:
        bold;

    }


    .lista-agenda {

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

    }


    .agendamento-admin {

      display:
        grid;

      grid-template-columns:
        130px 1.3fr 1fr 1fr 120px;

      gap:
        15px;

      align-items:
        center;

      padding:
        15px;

      border:
        1px solid #e4e4e4;

      border-radius:
        10px;

      background:
        #fff;

      transition:
        0.2s;

    }


    .agendamento-admin:hover {

      border-color:
        #bbb;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.06);

    }


    .horario-admin {

      font-size:
        17px;

      font-weight:
        bold;

      color:
        #111;

    }


    .cliente-admin {

      font-weight:
        bold;

      color:
        #222;

    }


    .servico-admin {

      color:
        #555;

    }


    .telefone-admin {

      color:
        #666;

      font-size:
        14px;

    }


    .status-admin {

      display:
        inline-flex;

      justify-content:
        center;

      align-items:
        center;

      min-height:
        30px;

      padding:
        5px 9px;

      border-radius:
        20px;

      background:
        #e8f7ed;

      color:
        #177238;

      font-size:
        12px;

      font-weight:
        bold;

    }


    .sem-agendamentos {

      text-align:
        center;

      padding:
        35px 20px;

      border:
        1px dashed #ccc;

      border-radius:
        10px;

      color:
        #666;

    }


    .sem-agendamentos strong {

      display:
        block;

      margin-bottom:
        6px;

      color:
        #333;

    }


    .loading {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        8px;

    }


    .spinner {

      width:
        16px;

      height:
        16px;

      border:
        2px solid #ddd;

      border-top-color:
        #111;

      border-radius:
        50%;

      animation:
        girar 0.8s linear infinite;

    }


    @keyframes girar {

      to {
        transform: rotate(360deg);
      }

    }


    .rodape {

      text-align:
        center;

      color:
        #999;

      font-size:
        12px;

      margin-top:
        25px;

    }


    @media (max-width: 800px) {

      .filtros {

        grid-template-columns:
          1fr;

      }


      .agendamento-admin {

        grid-template-columns:
          1fr 1fr;

      }


      .horario-admin {

        grid-column:
          1 / -1;

      }

    }


    @media (max-width: 500px) {

      .container {

        padding:
          15px 10px 40px;

      }


      .topo {

        padding:
          18px;

      }


      .topo h1 {

        font-size:
          22px;

      }


      .painel {

        padding:
          15px;

      }


      .agendamento-admin {

        grid-template-columns:
          1fr;

        gap:
          8px;

      }


      .horario-admin {

        grid-column:
          auto;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =================================================
         CABEÇALHO
         ================================================= -->

    <div class="topo">

      <h1>
        Painel Administrativo
      </h1>

      <p>
        Controle dos agendamentos da barbearia
      </p>

    </div>


    <!-- =================================================
         FILTROS
         ================================================= -->

    <div class="painel">

      <h2>
        Consultar agenda
      </h2>


      <div class="filtros">


        <!-- PROFISSIONAL -->

        <div class="campo">

          <label
            for="profissionalAdmin"
          >
            Profissional
          </label>


          <select
            id="profissionalAdmin"
            disabled
          >

            <option value="">
              Carregando profissionais...
            </option>

          </select>

        </div>


        <!-- DATA -->

        <div class="campo">

          <label
            for="dataAdmin"
          >
            Data
          </label>


          <input
            type="date"
            id="dataAdmin"
          >

        </div>


        <!-- BOTÃO -->

        <button
          type="button"
          id="btnCarregarAgenda"
          onclick="carregarAgendaAdmin()"
        >
          Ver agenda
        </button>


      </div>


      <div
        id="mensagemAdmin"
        style="margin-top:15px;"
      ></div>


    </div>


    <!-- =================================================
         AGENDA
         ================================================= -->

    <div class="painel">

      <div class="resumo">

        <div>

          <div
            class="resumo-titulo"
            id="tituloAgenda"
          >
            Agenda
          </div>

          <div
            class="resumo-data"
            id="subtituloAgenda"
          >
            Selecione um profissional e uma data.
          </div>

        </div>


        <div
          class="contador"
          id="contadorAgenda"
        >
          0 agendamentos
        </div>

      </div>


      <div
        id="agendaAdmin"
        class="lista-agenda"
      >

        <div class="sem-agendamentos">

          <strong>
            Nenhuma agenda carregada
          </strong>

          Selecione um profissional e uma data.

        </div>

      </div>

    </div>


    <div class="rodape">

      Sistema de agendamento da barbearia

    </div>


  </div>



  <script>


    /********************************************************
     * INICIALIZAÇÃO
     ********************************************************/

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        inicializarAdmin();

      }
    );


    function inicializarAdmin() {

      console.log(
        "========== ADMIN INICIADO =========="
      );


      definirDataAtual();


      carregarProfissionaisAdmin();

    }



    /********************************************************
     * DATA ATUAL
     ********************************************************/

    function definirDataAtual() {

      const elemento =
        document.getElementById(
          "dataAdmin"
        );


      if (!elemento) {

        return;

      }


      const agora =
        new Date();


      const ano =
        agora.getFullYear();


      const mes =
        String(
          agora.getMonth() + 1
        ).padStart(2, "0");


      const dia =
        String(
          agora.getDate()
        ).padStart(2, "0");


      elemento.value =
        ano +
        "-" +
        mes +
        "-" +
        dia;

    }



    /********************************************************
     * CARREGAR PROFISSIONAIS
     *
     * ESTA É A PARTE PRINCIPAL DO AJUSTE.
     *
     * O Admin é servido pelo Google Apps Script,
     * portanto usamos google.script.run.
     ********************************************************/

    function carregarProfissionaisAdmin() {

      const select =
        document.getElementById(
          "profissionalAdmin"
        );


      if (!select) {

        console.error(
          "Elemento #profissionalAdmin não encontrado."
        );

        return;

      }


      select.disabled =
        true;


      select.innerHTML =
        '<option value="">Carregando profissionais...</option>';


      mostrarMensagemAdmin(
        "Carregando profissionais...",
        "normal"
      );


      console.log(
        "Chamando carregarProfissionaisAdmin() no Apps Script..."
      );


      if (
        typeof google === "undefined" ||
        !google.script ||
        !google.script.run
      ) {

        console.error(
          "google.script.run não está disponível."
        );


        select.innerHTML =
          '<option value="">Admin deve ser aberto pelo Google Apps Script</option>';


        mostrarMensagemAdmin(
          "Este Admin.html precisa ser aberto pela URL do Google Apps Script, não pelo GitHub Pages.",
          "erro"
        );


        return;

      }


      google.script.run

        .withSuccessHandler(
          function(resposta) {

            console.log(
              "Resposta dos profissionais:",
              resposta
            );


            if (
              !resposta ||
              resposta.sucesso !== true
            ) {

              select.innerHTML =
                '<option value="">Erro ao carregar profissionais</option>';


              mostrarMensagemAdmin(
                resposta &&
                resposta.mensagem
                  ? resposta.mensagem
                  : "Erro ao carregar profissionais.",
                "erro"
              );


              select.disabled =
                false;


              return;

            }


            const profissionais =
              Array.isArray(
                resposta.profissionais
              )
                ? resposta.profissionais
                : [];


            console.log(
              "Profissionais recebidos:",
              profissionais
            );


            select.innerHTML =
              '<option value="">Selecione o profissional</option>';


            profissionais.forEach(
              function(profissional) {

                if (
                  !profissional ||
                  !profissional.nome
                ) {

                  return;

                }


                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  profissional.nome;


                option.textContent =
                  profissional.nome;


                select.appendChild(
                  option
                );

              }
            );


            select.disabled =
              false;


            if (
              profissionais.length === 0
            ) {

              select.innerHTML =
                '<option value="">Nenhum profissional encontrado</option>';


              mostrarMensagemAdmin(
                "Nenhum profissional ativo foi encontrado na aba Profissionais.",
                "erro"
              );

              return;

            }


            mostrarMensagemAdmin(
              profissionais.length +
              " profissional(is) carregado(s).",
              "sucesso"
            );


            /*
             * Seleciona automaticamente o primeiro
             * profissional quando existir apenas um.
             */

            if (
              profissionais.length === 1
            ) {

              select.value =
                profissionais[0].nome;

            }

          }
        )

        .withFailureHandler(
          function(erro) {

            console.error(
              "Erro ao executar carregarProfissionaisAdmin:",
              erro
            );


            select.innerHTML =
              '<option value="">Erro ao carregar profissionais</option>';


            select.disabled =
              false;


            let mensagem =
              "Erro ao carregar profissionais.";


            if (
              erro &&
              erro.message
            ) {

              mensagem =
                erro.message;

            }


            mostrarMensagemAdmin(
              mensagem,
              "erro"
            );

          }
        )

        .carregarProfissionaisAdmin();

    }



    /********************************************************
     * CARREGAR AGENDA
     ********************************************************/

    function carregarAgendaAdmin() {

      const profissionalElement =
        document.getElementById(
          "profissionalAdmin"
        );


      const dataElement =
        document.getElementById(
          "dataAdmin"
        );


      const botao =
        document.getElementById(
          "btnCarregarAgenda"
        );


      if (!profissionalElement) {

        mostrarMensagemAdmin(
          "Campo de profissional não encontrado.",
          "erro"
        );

        return;

      }


      if (!dataElement) {

        mostrarMensagemAdmin(
          "Campo de data não encontrado.",
          "erro"
        );

        return;

      }


      const profissional =
        String(
          profissionalElement.value || ""
        ).trim();


      const data =
        String(
          dataElement.value || ""
        ).trim();


      console.log(
        "========== CARREGAR AGENDA =========="
      );


      console.log(
        "Profissional:",
        profissional
      );


      console.log(
        "Data:",
        data
      );


      if (!profissional) {

        mostrarMensagemAdmin(
          "Selecione um profissional.",
          "erro"
        );


        return;

      }


      if (!data) {

        mostrarMensagemAdmin(
          "Selecione uma data.",
          "erro"
        );


        return;

      }


      botao.disabled =
        true;


      botao.innerHTML =
        '<span class="loading">' +
          '<span class="spinner"></span>' +
          'Carregando...' +
        '</span>';


      mostrarMensagemAdmin(
        "Buscando agendamentos...",
        "normal"
      );


      document.getElementById(
        "agendaAdmin"
      ).innerHTML =

        '<div class="sem-agendamentos">' +
          '<div class="loading">' +
            '<span class="spinner"></span>' +
            'Carregando agenda...' +
          '</div>' +
        '</div>';


      google.script.run

        .withSuccessHandler(
          function(resposta) {

            console.log(
              "Resposta da agenda:",
              resposta
            );


            botao.disabled =
              false;


            botao.textContent =
              "Ver agenda";


            if (
              !resposta ||
              resposta.sucesso !== true
            ) {

              mostrarMensagemAdmin(
                resposta &&
                resposta.mensagem
                  ? resposta.mensagem
                  : "Erro ao carregar agenda.",
                "erro"
              );


              renderizarAgendaAdmin(
                [],
                profissional,
                data
              );


              return;

            }


            const agendamentos =
              Array.isArray(
                resposta.agendamentos
              )
                ? resposta.agendamentos
                : [];


            renderizarAgendaAdmin(
              agendamentos,
              profissional,
              data
            );


            mostrarMensagemAdmin(
              "Agenda carregada com sucesso.",
              "sucesso"
            );

          }
        )

        .withFailureHandler(
          function(erro) {

            console.error(
              "Erro ao carregar agenda:",
              erro
            );


            botao.disabled =
              false;


            botao.textContent =
              "Ver agenda";


            let mensagem =
              "Erro ao carregar agenda.";


            if (
              erro &&
              erro.message
            ) {

              mensagem =
                erro.message;

            }


            mostrarMensagemAdmin(
              mensagem,
              "erro"
            );


            renderizarAgendaAdmin(
              [],
              profissional,
              data
            );

          }
        )

        .obterAgendamentos({

          profissional:
            profissional,

          data:
            data

        });

    }



    /********************************************************
     * RENDERIZAR AGENDA
     ********************************************************/

    function renderizarAgendaAdmin(
      agendamentos,
      profissional,
      data
    ) {

      const elemento =
        document.getElementById(
          "agendaAdmin"
        );


      const titulo =
        document.getElementById(
          "tituloAgenda"
        );


      const subtitulo =
        document.getElementById(
          "subtituloAgenda"
        );


      const contador =
        document.getElementById(
          "contadorAgenda"
        );


      if (!elemento) {

        return;

      }


      titulo.textContent =
        profissional
          ? "Agenda de " + profissional
          : "Agenda";


      subtitulo.textContent =
        data
          ? "Data: " + formatarDataBR(data)
          : "Selecione uma data.";


      const total =
        Array.isArray(agendamentos)
          ? agendamentos.length
          : 0;


      contador.textContent =
        total +
        (
          total === 1
            ? " agendamento"
            : " agendamentos"
        );


      if (!total) {

        elemento.innerHTML =

          '<div class="sem-agendamentos">' +

            '<strong>' +
              'Nenhum agendamento encontrado' +
            '</strong>' +

            'Não existem agendamentos para ' +

            escaparHtmlAdmin(
              profissional
            ) +

            ' em ' +

            escaparHtmlAdmin(
              formatarDataBR(data)
            ) +

          '</div>';


        return;

      }


      /*
       * Garante ordenação por horário.
       */

      agendamentos.sort(
        function(a, b) {

          const horaA =
            converterHoraParaMinutosAdmin(
              a.horaInicio
            );


          const horaB =
            converterHoraParaMinutosAdmin(
              b.horaInicio
            );


          return horaA - horaB;

        }
      );


      elemento.innerHTML =
        agendamentos
          .map(
            function(agendamento) {

              const horaInicio =
                escaparHtmlAdmin(
                  agendamento.horaInicio || ""
                );


              const horaFim =
                escaparHtmlAdmin(
                  agendamento.horaFim || ""
                );


              const cliente =
                escaparHtmlAdmin(
                  agendamento.cliente || ""
                );


              const servico =
                escaparHtmlAdmin(
                  agendamento.servico || ""
                );


              const telefone =
                escaparHtmlAdmin(
                  agendamento.telefone || ""
                );


              const status =
                escaparHtmlAdmin(
                  agendamento.status ||
                  "Agendado"
                );


              return `

                <div class="agendamento-admin">

                  <div class="horario-admin">
                    ${horaInicio}
                    -
                    ${horaFim}
                  </div>

                  <div class="cliente-admin">
                    ${cliente || "Cliente não informado"}
                  </div>

                  <div class="servico-admin">
                    ${servico || "Serviço não informado"}
                  </div>

                  <div class="telefone-admin">
                    ${telefone || "Telefone não informado"}
                  </div>

                  <div class="status-admin">
                    ${status}
                  </div>

                </div>

              `;

            }
          )
          .join("");

    }



    /********************************************************
     * MENSAGENS
     ********************************************************/

    function mostrarMensagemAdmin(
      mensagem,
      tipo
    ) {

      const elemento =
        document.getElementById(
          "mensagemAdmin"
        );


      if (!elemento) {

        return;

      }


      if (!mensagem) {

        elemento.innerHTML =
          "";

        return;

      }


      let classe =
        "mensagem";


      if (
        tipo === "erro"
      ) {

        classe +=
          " erro";

      }


      if (
        tipo === "sucesso"
      ) {

        classe +=
          " sucesso";

      }


      elemento.innerHTML =
        '<div class="' +
        classe +
        '">' +
        escaparHtmlAdmin(
          mensagem
        ) +
        '</div>';

    }



    /********************************************************
     * FORMATAR DATA
     ********************************************************/

    function formatarDataBR(
      data
    ) {

      if (!data) {

        return "";

      }


      const partes =
        String(data).split("-");


      if (
        partes.length !== 3
      ) {

        return String(data);

      }


      return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
      );

    }



    /********************************************************
     * CONVERTER HORA NO ADMIN
     ********************************************************/

    function converterHoraParaMinutosAdmin(
      valor
    ) {

      if (
        valor === null ||
        typeof valor === "undefined" ||
        valor === ""
      ) {

        return 9999;

      }


      const texto =
        String(valor).trim();


      const match =
        texto.match(
          /^(\d{1,2}):(\d{1,2})/
        );


      if (!match) {

        return 9999;

      }


      return (
        Number(match[1]) * 60 +
        Number(match[2])
      );

    }



    /********************************************************
     * ESCAPAR HTML
     ********************************************************/

    function escaparHtmlAdmin(
      valor
    ) {

      return String(
        valor === null ||
        typeof valor === "undefined"
          ? ""
          : valor
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }



    /********************************************************
     * ENTER NO CAMPO DE DATA
     ********************************************************/

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key !== "Enter"
        ) {

          return;

        }


        const alvo =
          event.target;


        if (
          alvo &&
          (
            alvo.id ===
              "profissionalAdmin" ||

            alvo.id ===
              "dataAdmin"
          )
        ) {

          carregarAgendaAdmin();

        }

      }
    );


  </script>
