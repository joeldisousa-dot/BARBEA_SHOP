body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #111, #1b1b1b, #050505);

}

.logo {

}

h1 {

}

  color: #aaa;

.campo {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;

  font-size: 14px;

input,
select {
  width: 100%;
  padding: 14px 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #101010;
  color: #fff;
  font-size: 16px;
  outline: none;

input:focus,
select:focus {
  border-color: #d4af37;

.info-servico strong {

}

.horarios {
  display: grid;
  grid-template-columns: repeat(3, 1fr);

}

.horario {
  border: 1px solid #3b3b3b;

  border-radius: 10px;
  padding: 12px 5px;

  font-weight: bold;
  transition: .2s;
}

.horario:hover {
  border-color: #d4af37;
  transform: translateY(-1px);
}

.horario.selecionado {
  background: #d4af37;
  color: #111;
  border-color: #d4af37;
}

.horario-indisponivel {
  color: #777;
  text-align: center;
  padding: 15px;
  grid-column: 1 / -1;
}

.botao {
  width: 100%;
  border: none;
  border-radius: 13px;
  padding: 16px;
  background: linear-gradient(135deg, #d4af37, #f1d36a);
  color: #111;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.botao:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.mensagem {
  display: none;
  padding: 14px;
  border-radius: 12px;

  font-size: 14px;
  line-height: 1.5;
}

.mensagem.erro {
  display: block;
  background: rgba(220,53,69,.12);
  border: 1px solid rgba(220,53,69,.35);
  color: #ff9da7;
}

.mensagem.sucesso {
  display: block;
  background: rgba(40,167,69,.12);
  border: 1px solid rgba(40,167,69,.35);
  color: #8ff0a4;
}

.carregando {
  display: none;
  text-align: center;
  color: #aaa;
  margin: 10px 0 20px;
}

.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid #444;
  border-top-color: #d4af37;
  border-radius: 50%;
  animation: girar .8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}

@keyframes girar {
  to {
    transform: rotate(360deg);
  }
}

.resumo {
  display: none;
  margin-top: 20px;
  padding: 18px;
  border-radius: 14px;
  background: #101010;
  border: 1px solid #2d2d2d;
}

.resumo h2 {
  color: #d4af37;
  font-size: 18px;
  margin-bottom: 14px;
}

.resumo-linha {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 7px 0;
  border-bottom: 1px solid #242424;
  font-size: 14px;
}

.resumo-linha:last-child {
  border-bottom: none;
}

.resumo-linha span:first-child {
  color: #888;
}

.resumo-linha span:last-child {
  text-align: right;
  color: #fff;
  font-weight: bold;
}

.rodape {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-top: 20px;
}

.obrigatorio {
  color: #d4af37;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
  }

  .card {
    padding: 18px;
    border-radius: 16px;
  }

  .linha {
    grid-template-columns: 1fr;
  }

  .horarios {
    grid-template-columns: repeat(2, 1fr);
  }

  h1 {
    font-size: 24px;
  }
}

</style> </head> <body> <div class="container"> <div class="card">
<div class="logo">💈</div>

<h1>Agendamento Online</h1>

<div class="subtitulo">
  Escolha seu serviço, profissional, data e horário.
</div>

</div>

<div class="campo">

  </select>
</div>

<div class="linha">

  <div class="campo">

    <label for="data">

    </label>

    <input id="data" type="date">

  </div>

  <div class="campo">

    <label>
      Horário <span class="obrigatorio">*</span>
    </label>

    <div id="horarios" class="horarios">

      <div class="horario-indisponivel">

      </div>

    </div>

  </div>

</div>

<input type="hidden" id="horaInicio">

<button
  id="btnAgendar"
  class="botao"
  type="button"
  disabled>
  Confirmar agendamento
</button>

<div id="resumo" class="resumo">

  <h2>Agendamento confirmado</h2>

  <div class="resumo-linha">
    <span>Cliente</span>

  </div>

  <div class="resumo-linha">

    <span id="resServico"></span>
  </div>

  <div class="resumo-linha">
    <span>Profissional</span>
    <span id="resProfissional"></span>
  </div>

  <div class="resumo-linha">
    <span>Data</span>
    <span id="resData"></span>
  </div>

  <div class="resumo-linha">
    <span>Horário</span>
    <span id="resHora"></span>
  </div>

  <div class="resumo-linha">
    <span>Valor</span>
    <span id="resPreco"></span>
  </div>

  <div class="resumo-linha">
    <span>Protocolo</span>
    <span id="resId"></span>
  </div>

</div>

<div class="rodape">
  Sistema de agendamento online
</div>

</div> </div> <script>
const API_URL =
"https://script.google.com/macros/s/AKfycbyaDcSCmCyR-LHK9N-r2vy3LKQgS6a5IOuezNBb_MBw4ncglSRdPN5efiDvvzP-kSab/exec";

let servicos = [];
let profissionais = [];
let horariosDisponiveis = [];

const cliente = document.getElementById("cliente");
const telefone = document.getElementById("telefone");
const servico = document.getElementById("servico");
const profissional = document.getElementById("profissional");
const data = document.getElementById("data");
const horarios = document.getElementById("horarios");
const horaInicio = document.getElementById("horaInicio");
const btnAgendar = document.getElementById("btnAgendar");
const mensagem = document.getElementById("mensagem");
const carregando = document.getElementById("carregando");
const infoServico = document.getElementById("infoServico");
const resumo = document.getElementById("resumo");

document.addEventListener("DOMContentLoaded", () => {

definirDataMinima();

aplicarMascaraTelefone();

testarAPI();

});

function definirDataMinima() {

const hoje = new Date();

const ano = hoje.getFullYear();

const mes =
String(hoje.getMonth() + 1)
.padStart(2, "0");

const dia =
String(hoje.getDate())
.padStart(2, "0");

data.min =
${ano}-${mes}-${dia};
}

function aplicarMascaraTelefone() {

telefone.addEventListener("input", () => {

let valor =
  telefone.value
    .replace(/\D/g, "")
    .substring(0, 11);

if (valor.length <= 10) {

  valor = valor.replace(
    /^(\d{0,2})(\d{0,4})(\d{0,4})/,
    (_, ddd, parte1, parte2) => {

      let r = "";

      if (ddd) r += `(${ddd})`;
      if (parte1) r += ` ${parte1}`;
      if (parte2) r += `-${parte2}`;

      return r;
    }
  );

} else {

  valor = valor.replace(
    /^(\d{0,2})(\d{0,5})(\d{0,4})/,
    (_, ddd, parte1, parte2) => {

      let r = "";

      if (ddd) r += `(${ddd})`;
      if (parte1) r += ` ${parte1}`;
      if (parte2) r += `-${parte2}`;

      return r;
    }
  );
}

telefone.value = valor;

atualizarBotao();

});
}

function testarAPI() {

mostrarCarregando(true);

chamarAPI({
acao: "dados"
})
.then(resposta => {

console.log("RESPOSTA API:", resposta);

if (!resposta || resposta.sucesso !== true) {

  throw new Error(
    resposta?.mensagem ||
    "O Google Apps Script respondeu, mas retornou erro."
  );
}

servicos =
  Array.isArray(resposta.servicos)
    ? resposta.servicos
    : [];

profissionais =
  Array.isArray(resposta.profissionais)
    ? resposta.profissionais
    : [];

preencherServicos();
preencherProfissionais();

mostrarMensagem(
  "Sistema conectado com sucesso.",
  "sucesso"
);

setTimeout(limparMensagem, 2500);

})
.catch(erro => {

console.error("ERRO API:", erro);

mostrarMensagem(
  "ERRO DE CONEXÃO: " +
  erro.message,
  "erro"
);

})
.finally(() => {

mostrarCarregando(false);

});
}

function chamarAPI(parametros) {

return new Promise((resolve, reject) => {

const callbackName =
  "callback_" +
  Date.now() +
  "_" +
  Math.floor(Math.random() * 100000);

const script =
  document.createElement("script");

let terminou = false;

const timeout =
  setTimeout(() => {

    if (terminou) return;

    terminou = true;

    limpar();

    reject(
      new Error(
        "O Google Apps Script não respondeu dentro do tempo esperado."
      )
    );

  }, 20000);

window[callbackName] = resposta => {

  if (terminou) return;

  terminou = true;

  clearTimeout(timeout);

  limpar();

  resolve(resposta);
};

function limpar() {

  try {
    delete window[callbackName];
  } catch (e) {
    window[callbackName] = undefined;
  }

  if (script.parentNode) {
    script.parentNode.removeChild(script);
  }
}

const query =
  new URLSearchParams();

Object.entries(parametros || {})
  .forEach(([chave, valor]) => {

    if (
      valor !== undefined &&
      valor !== null
    ) {

      query.set(
        chave,
        String(valor)
      );
    }
  });

query.set(
  "callback",
  callbackName
);

query.set(
  "_",
  Date.now()
);

script.src =
  API_URL +
  "?" +
  query.toString();

script.async = true;

script.onerror = () => {

  if (terminou) return;

  terminou = true;

  clearTimeout(timeout);

  limpar();

  reject(
    new Error(
      "O navegador não conseguiu carregar a resposta do Google Apps Script. O doGet/JSONP do Code.gs precisa ser corrigido."
    )
  );

};

document.head.appendChild(script);

});
}

function preencherServicos() {

servico.innerHTML =
'<option value="">Selecione o serviço</option>';

servicos.forEach(item => {

const option =
  document.createElement("option");

option.value = item.nome;
option.textContent = item.nome;

servico.appendChild(option);

});
}

function preencherProfissionais() {

profissional.innerHTML =
'<option value="">Selecione o profissional</option>';

profissionais.forEach(item => {

const option =
  document.createElement("option");

option.value = item.nome;
option.textContent = item.nome;

profissional.appendChild(option);

});
}

servico.addEventListener("change", () => {

mostrarInformacaoServico();

carregarHorarios();

});

profissional.addEventListener(
"change",
carregarHorarios
);

data.addEventListener(
"change",
carregarHorarios
);

cliente.addEventListener(
"input",
atualizarBotao
);

telefone.addEventListener(
"input",
atualizarBotao
);

btnAgendar.addEventListener(
"click",
realizarAgendamento
);

function mostrarInformacaoServico() {

const item =
servicos.find(
x => x.nome === servico.value
);

if (!item) {

infoServico.style.display = "none";

return;

}

const preco =
Number(item.preco || 0);

const duracao =
Number(item.duracao || 0);

infoServico.innerHTML =
<strong>${escaparHTML(item.nome)}</strong><br> ${duracao} minutos · ${formatarPreco(preco)};

infoServico.style.display =
"block";
}

async function carregarHorarios() {

horaInicio.value = "";

atualizarBotao();

horarios.innerHTML =
<div class="horario-indisponivel"> Selecione serviço, profissional e data. </div>;

if (
!servico.value ||
!profissional.value ||
!data.value
) {

return;

}

if (!validarData()) {
return;
}

horarios.innerHTML =
<div class="horario-indisponivel"> <span class="spinner"></span> Carregando horários... </div>;

try {

const resposta =
  await chamarAPI({

    acao: "horarios",

    servico:
      servico.value,

    profissional:
      profissional.value,

    data:
      data.value

  });

console.log(
  "HORÁRIOS:",
  resposta
);

if (
  !resposta ||
  resposta.sucesso !== true
) {

  throw new Error(
    resposta?.mensagem ||
    "Erro ao carregar horários."
  );
}

horariosDisponiveis =
  Array.isArray(resposta.horarios)
    ? resposta.horarios
    : [];

renderizarHorarios();

}
catch (erro) {

console.error(
  "ERRO HORÁRIOS:",
  erro
);

horarios.innerHTML =
  `<div class="horario-indisponivel">
    ${escaparHTML(erro.message)}
   </div>`;

}
}

function validarData() {

if (!data.value) {
return false;
}

const hoje =
new Date();

hoje.setHours(
0, 0, 0, 0
);

const partes =
data.value.split("-");

const selecionada =
new Date(
Number(partes[0]),
Number(partes[1]) - 1,
Number(partes[2])
);

if (selecionada < hoje) {

mostrarMensagem(
  "A data selecionada já passou.",
  "erro"
);

return false;

}

return true;
}

function renderizarHorarios() {

horarios.innerHTML = "";

if (!horariosDisponiveis.length) {

horarios.innerHTML =
  `<div class="horario-indisponivel">
    Nenhum horário disponível para esta data.
   </div>`;

return;

}

horariosDisponiveis.forEach(item => {

const botao =
  document.createElement("button");

botao.type = "button";

botao.className = "horario";

botao.textContent =
  item.inicio;

botao.addEventListener(
  "click",
  () => {

    document
      .querySelectorAll(".horario")
      .forEach(b =>
        b.classList.remove(
          "selecionado"
        )
      );

    botao.classList.add(
      "selecionado"
    );

    horaInicio.value =
      item.inicio;

    atualizarBotao();

  }
);

horarios.appendChild(
  botao
);

});
}

function atualizarBotao() {

const pronto =
cliente.value.trim().length >= 2 &&
telefone.value.replace(/\D/g, "").length >= 8 &&
servico.value &&
profissional.value &&
data.value &&
horaInicio.value;

btnAgendar.disabled =
!pronto;
}

async function realizarAgendamento() {

limparMensagem();

const nome =
cliente.value.trim();

const fone =
telefone.value.trim();

if (nome.length < 2) {

mostrarMensagem(
  "Digite um nome válido.",
  "erro"
);

cliente.focus();

return;

}

if (
fone.replace(/\D/g, "").length < 8
) {

mostrarMensagem(
  "Digite um telefone válido.",
  "erro"
);

telefone.focus();

return;

}

btnAgendar.disabled = true;

btnAgendar.textContent =
"Agendando...";

mostrarCarregando(true);

try {

const resposta =
  await chamarAPI({

    acao: "agendar",

    cliente: nome,

    telefone: fone,

    servico:
      servico.value,

    profissional:
      profissional.value,

    data:
      data.value,

    horaInicio:
      horaInicio.value

  });

console.log(
  "AGENDAMENTO:",
  resposta
);

if (
  !resposta ||
  resposta.sucesso !== true
) {

  throw new Error(
    resposta?.mensagem ||
    "Não foi possível realizar o agendamento."
  );
}

mostrarResumo(
  resposta
);

mostrarMensagem(
  resposta.mensagem ||
  "Agendamento realizado com sucesso!",
  "sucesso"
);

limparFormulario();

}
catch (erro) {

console.error(
  "ERRO AGENDAMENTO:",
  erro
);

mostrarMensagem(
  erro.message ||
  "Erro ao realizar agendamento.",
  "erro"
);

}
finally {

mostrarCarregando(false);

btnAgendar.textContent =
  "Confirmar agendamento";

atualizarBotao();

}
}

function mostrarResumo(resposta) {

document.getElementById(
"resCliente"
).textContent =
resposta.cliente ||
cliente.value;

document.getElementById(
"resServico"
).textContent =
resposta.servico ||
servico.value;

document.getElementById(
"resProfissional"
).textContent =
resposta.profissional ||
profissional.value;

document.getElementById(
"resData"
).textContent =
resposta.dataBR ||
formatarDataBR(data.value);

document.getElementById(
"resHora"
).textContent =
resposta.horaInicio ||
horaInicio.value;

document.getElementById(
"resPreco"
).textContent =
formatarPreco(
Number(
resposta.preco ||
obterPreco()
)
);

document.getElementById(
"resId"
).textContent =
resposta.id ||
"Confirmado";

resumo.style.display =
"block";

resumo.scrollIntoView({
behavior: "smooth",
block: "start"
});
}

function limparFormulario() {

cliente.value = "";
telefone.value = "";
servico.value = "";
profissional.value = "";
data.value = "";
horaInicio.value = "";

infoServico.style.display =
"none";

horarios.innerHTML =
<div class="horario-indisponivel"> Selecione serviço, profissional e data. </div>;
}

function obterPreco() {

const item =
servicos.find(
x => x.nome === servico.value
);

return item
? Number(item.preco || 0)
: 0;
}

function formatarPreco(valor) {

return Number(valor || 0)
.toLocaleString(
"pt-BR",
{
style: "currency",
currency: "BRL"
}
);
}

function formatarDataBR(valor) {

if (!valor) return "";

const p =
String(valor).split("-");

if (p.length !== 3) {
return valor;
}

return ${p[2]}/${p[1]}/${p[0]};
}

function mostrarMensagem(
texto,
tipo
) {

mensagem.className =
"mensagem " +
(
tipo === "sucesso"
? "sucesso"
: "erro"
);

mensagem.textContent =
texto;

mensagem.style.display =
"block";
}

function limparMensagem() {

mensagem.className =
"mensagem";

mensagem.textContent =
"";

mensagem.style.display =
"none";
}

function mostrarCarregando(
mostrar
) {

carregando.style.display =
mostrar
? "block"
: "none";
}

function escaparHTML(texto) {

return String(texto || "")
.replace(/&/g, "&")
.replace(/</g, "<")
.replace(/>/g, ">")
.replace(/"/g, """)
.replace(/'/g, "'");
}
