<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Agendamento - Barbearia</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111111,
          #1b1b1b,
          #050505
        );

      color: #ffffff;

      min-height: 100vh;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;

      margin: 0 auto;
    }

    .card {
      background: #181818;

      border:
        1px solid
        rgba(255,255,255,0.08);

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.45);
    }

    .logo {
      text-align: center;

      margin-bottom: 10px;

      font-size: 42px;
    }

    h1 {
      text-align: center;

      font-size: 27px;

      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;

      color: #aaa;

      margin-bottom: 28px;

      font-size: 14px;
    }

    .campo {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #ddd;

      font-weight: bold;

      font-size: 14px;
    }

    input,
    select {

      width: 100%;

      padding: 14px 15px;

      border-radius: 12px;

      border:
        1px solid
        #333;

      background: #101010;

      color: #fff;

      font-size: 16px;

      outline: none;
    }

    input:focus,
    select:focus {

      border-color: #d4af37;

      box-shadow:
        0 0 0 2px
        rgba(212,175,55,0.12);
    }

    select option {
      background: #181818;

      color: #fff;
    }

    .linha {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 14px;
    }

    .info-servico {

      display: none;

      margin-top: -5px;

      margin-bottom: 18px;

      padding: 14px;

      border-radius: 12px;

      background:
        rgba(212,175,55,0.08);

      border:
        1px solid
        rgba(212,175,55,0.25);

      color: #ddd;

      font-size: 14px;
    }

    .info-servico strong {
      color: #d4af37;
    }

    .horarios {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 10px;
    }

    .horario {

      border:
        1px solid
        #3b3b3b;

      background: #111;

      color: #fff;

      border-radius: 10px;

      padding: 12px 5px;

      cursor: pointer;

      font-weight: bold;

      transition:
        0.2s;
    }

    .horario:hover {

      border-color:
        #d4af37;

      transform:
        translateY(-1px);
    }

    .horario.selecionado {

      background:
        #d4af37;

      color: #111;

      border-color:
        #d4af37;
    }

    .horario-indisponivel {

      color: #777;

      text-align: center;

      padding: 15px;

      grid-column:
        1 / -1;
    }

    .botao {

      width: 100%;

      border: none;

      border-radius: 13px;

      padding: 16px;

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f1d36a
        );

      color: #111;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

      transition:
        0.2s;
    }

    .botao:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 8px 20px
        rgba(212,175,55,0.2);
    }

    .botao:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }

    .mensagem {

      display: none;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 18px;

      font-size: 14px;

      line-height: 1.5;
    }

    .mensagem.erro {

      display: block;

      background:
        rgba(220,53,69,0.12);

      border:
        1px solid
        rgba(220,53,69,0.35);

      color: #ff9da7;
    }

    .mensagem.sucesso {

      display: block;

      background:
        rgba(40,167,69,0.12);

      border:
        1px solid
        rgba(40,167,69,0.35);

      color: #8ff0a4;
    }

    .carregando {

      display: none;

      text-align: center;

      color: #aaa;

      margin:
        10px 0 20px;
    }

    .spinner {

      display: inline-block;

      width: 18px;

      height: 18px;

      border:
        2px solid
        #444;

      border-top-color:
        #d4af37;

      border-radius: 50%;

      animation:
        girar 0.8s linear infinite;

      vertical-align: middle;

      margin-right: 6px;
    }

    @keyframes girar {

      to {
        transform:
          rotate(360deg);
      }

    }

    .resumo {

      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 14px;

      background: #101010;

      border:
        1px solid
        #2d2d2d;
    }

    .resumo h2 {

      color: #d4af37;

      font-size: 18px;

      margin-bottom: 14px;
    }

    .resumo-linha {

      display: flex;

      justify-content:
        space-between;

      gap: 15px;

      padding: 7px 0;

      border-bottom:
        1px solid
        #242424;

      font-size: 14px;
    }

    .resumo-linha:last-child {
      border-bottom: none;
    }

    .resumo-linha span:first-child {
      color: #888;
    }

    .resumo-linha span:last-child {
      text-align: right;

      color: #fff;

      font-weight: bold;
    }

    .rodape {

      text-align: center;

      color: #666;

      font-size: 12px;

      margin-top: 20px;
    }

    .campo-hora {
      margin-top: 18px;
    }

    .obrigatorio {
      color: #d4af37;
    }

    @media (max-width: 500px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 18px;

        border-radius: 16px;
      }

      .linha {
        grid-template-columns:
          1fr;
      }

      .horarios {
        grid-template-columns:
          repeat(2, 1fr);
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>
</head>


<body>

  <div class="container">

    <div class="card">

      <div class="logo">
        💈
      </div>

      <h1>
        Agendamento Online
      </h1>

      <div class="subtitulo">
        Escolha seu serviço, profissional,
        data e horário.
      </div>


      <div
        id="mensagem"
        class="mensagem"
      ></div>


      <div
        id="carregando"
        class="carregando"
      >
        <span class="spinner"></span>
        Carregando...
      </div>


      <!-- CLIENTE -->

      <div class="campo">

        <label for="cliente">
          Nome
          <span class="obrigatorio">*</span>
        </label>

        <input
          id="cliente"
          type="text"
          placeholder="Digite seu nome"
          autocomplete="name"
        >

      </div>


      <!-- TELEFONE -->

      <div class="campo">

        <label for="telefone">
          Telefone
          <span class="obrigatorio">*</span>
        </label>

        <input
          id="telefone"
          type="tel"
          placeholder="(00) 00000-0000"
          autocomplete="tel"
          maxlength="15"
        >

      </div>


      <!-- SERVIÇO -->

      <div class="campo">

        <label for="servico">
          Serviço
          <span class="obrigatorio">*</span>
        </label>

        <select id="servico">

          <option value="">
            Carregando serviços...
          </option>

        </select>

      </div>


      <div
        id="infoServico"
        class="info-servico"
      ></div>


      <!-- PROFISSIONAL -->

      <div class="campo">

        <label for="profissional">
          Profissional
          <span class="obrigatorio">*</span>
        </label>

        <select id="profissional">

          <option value="">
            Carregando profissionais...
          </option>

        </select>

      </div>


      <!-- DATA -->

      <div class="linha">

        <div class="campo">

          <label for="data">
            Data
            <span class="obrigatorio">*</span>
          </label>

          <input
            id="data"
            type="date"
          >

        </div>


        <div class="campo">

          <label>
            Horário
            <span class="obrigatorio">*</span>
          </label>

          <div
            id="horarios"
            class="horarios"
          >

            <div
              class="horario-indisponivel"
            >
              Selecione serviço,
              profissional e data.
            </div>

          </div>

        </div>

      </div>


      <input
        type="hidden"
        id="horaInicio"
        value=""
      >


      <button
        id="btnAgendar"
        class="botao"
        type="button"
        disabled
      >
        Confirmar agendamento
      </button>


      <div
        id="resumo"
        class="resumo"
      >

        <h2>
          Agendamento confirmado
        </h2>

        <div class="resumo-linha">
          <span>Cliente</span>
          <span id="resCliente"></span>
        </div>

        <div class="resumo-linha">
          <span>Serviço</span>
          <span id="resServico"></span>
        </div>

        <div class="resumo-linha">
          <span>Profissional</span>
          <span id="resProfissional"></span>
        </div>

        <div class="resumo-linha">
          <span>Data</span>
          <span id="resData"></span>
        </div>

        <div class="resumo-linha">
          <span>Horário</span>
          <span id="resHora"></span>
        </div>

        <div class="resumo-linha">
          <span>Valor</span>
          <span id="resPreco"></span>
        </div>

        <div class="resumo-linha">
          <span>Protocolo</span>
          <span id="resId"></span>
        </div>

      </div>


      <div class="rodape">
        Sistema de agendamento online
      </div>

    </div>

  </div>


  <script>

    /* ======================================================
       CONFIGURAÇÃO DA API
       ====================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyaDcSCmCyR-LHK9N-r2vy3LKQgS6a5IOuezNBb_MBw4ncglSRdPN5efiDvvzP-kSab/exec";


    /* ======================================================
       ESTADO
       ====================================================== */

    let servicos = [];

    let profissionais = [];

    let horariosDisponiveis = [];

    let dadosCarregados = false;


    /* ======================================================
       ELEMENTOS
       ====================================================== */

    const cliente =
      document.getElementById(
        "cliente"
      );

    const telefone =
      document.getElementById(
        "telefone"
      );

    const servico =
      document.getElementById(
        "servico"
      );

    const profissional =
      document.getElementById(
        "profissional"
      );

    const data =
      document.getElementById(
        "data"
      );

    const horarios =
      document.getElementById(
        "horarios"
      );

    const horaInicio =
      document.getElementById(
        "horaInicio"
      );

    const btnAgendar =
      document.getElementById(
        "btnAgendar"
      );

    const mensagem =
      document.getElementById(
        "mensagem"
      );

    const carregando =
      document.getElementById(
        "carregando"
      );

    const infoServico =
      document.getElementById(
        "infoServico"
      );

    const resumo =
      document.getElementById(
        "resumo"
      );


    /* ======================================================
       INICIALIZAÇÃO
       ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        definirDataMinima();

        aplicarMascaraTelefone();

        carregarDados();

      }
    );


    /* ======================================================
       DATA MÍNIMA
       ====================================================== */

    function definirDataMinima() {

      const agora =
        new Date();

      const ano =
        agora.getFullYear();

      const mes =
        String(
          agora.getMonth() + 1
        ).padStart(2, "0");

      const dia =
        String(
          agora.getDate()
        ).padStart(2, "0");

      data.min =
        ano +
        "-" +
        mes +
        "-" +
        dia;

    }


    /* ======================================================
       MÁSCARA TELEFONE
       ====================================================== */

    function aplicarMascaraTelefone() {

      telefone.addEventListener(
        "input",
        function() {

          let valor =
            telefone.value
              .replace(/\D/g, "")
              .substring(0, 11);


          if (valor.length <= 10) {

            valor =
              valor.replace(
                /^(\d{0,2})(\d{0,4})(\d{0,4}).*/,
                function(_, ddd, parte1, parte2) {

                  let resultado = "";

                  if (ddd) {
                    resultado +=
                      "(" + ddd + ")";
                  }

                  if (parte1) {
                    resultado +=
                      " " + parte1;
                  }

                  if (parte2) {
                    resultado +=
                      "-" + parte2;
                  }

                  return resultado;

                }
              );

          }

          else {

            valor =
              valor.replace(
                /^(\d{0,2})(\d{0,5})(\d{0,4}).*/,
                function(_, ddd, parte1, parte2) {

                  let resultado = "";

                  if (ddd) {
                    resultado +=
                      "(" + ddd + ")";
                  }

                  if (parte1) {
                    resultado +=
                      " " + parte1;
                  }

                  if (parte2) {
                    resultado +=
                      "-" + parte2;
                  }

                  return resultado;

                }
              );

          }


          telefone.value =
            valor;

        }
      );

    }


    /* ======================================================
       JSONP
       ======================================================

       O GitHub Pages não pode fazer fetch diretamente
       para o Google Apps Script por causa do CORS.

       JSONP permite realizar consultas GET através
       de uma tag <script>, evitando o bloqueio CORS.

       O Código.gs precisa aceitar:
          ?callback=nomeDaFuncao
       ====================================================== */

    function chamarAPI(
      parametros
    ) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            "callbackAPI_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 100000
            );


          const script =
            document.createElement(
              "script"
            );


          let finalizado =
            false;


          const timeout =
            setTimeout(
              function() {

                if (finalizado) {
                  return;
                }

                finalizado = true;

                cleanup();

                reject(
                  new Error(
                    "Tempo limite excedido ao conectar ao sistema."
                  )
                );

              },
              20000
            );


          window[callbackName] =
            function(resposta) {

              if (finalizado) {
                return;
              }

              finalizado = true;

              clearTimeout(
                timeout
              );

              cleanup();

              resolve(
                resposta
              );

            };


          function cleanup() {

            try {

              delete window[
                callbackName
              ];

            }

            catch (e) {

              window[
                callbackName
              ] = undefined;

            }


            if (script.parentNode) {

              script.parentNode.removeChild(
                script
              );

            }

          }


          const query =
            new URLSearchParams();


          Object.keys(
            parametros || {}
          ).forEach(
            function(chave) {

              const valor =
                parametros[chave];

              if (
                valor !== undefined &&
                valor !== null
              ) {

                query.set(
                  chave,
                  String(valor)
                );

              }

            }
          );


          query.set(
            "callback",
            callbackName
          );


          query.set(
            "_",
            Date.now()
          );


          script.src =
            API_URL +
            "?" +
            query.toString();


          script.async = true;


          script.onerror =
            function() {

              if (finalizado) {
                return;
              }

              finalizado = true;

              clearTimeout(
                timeout
              );

              cleanup();

              reject(
                new Error(
                  "Não foi possível conectar ao sistema."
                )
              );

            };


          document
            .head
            .appendChild(
              script
            );

        }
      );

    }


    /* ======================================================
       CARREGAR DADOS
       ====================================================== */

    async function carregarDados() {

      mostrarCarregando(
        true
      );

      limparMensagem();


      try {

        const resposta =
          await chamarAPI({
            acao: "dados"
          });


        if (
          !resposta ||
          resposta.sucesso !== true
        ) {

          throw new Error(
            resposta &&
            resposta.mensagem
              ? resposta.mensagem
              : "Erro ao carregar dados."
          );

        }


        servicos =
          Array.isArray(
            resposta.servicos
          )
            ? resposta.servicos
            : [];


        profissionais =
          Array.isArray(
            resposta.profissionais
          )
            ? resposta.profissionais
            : [];


        preencherServicos();

        preencherProfissionais();


        dadosCarregados =
          true;


        mostrarMensagem(
          "Sistema conectado com sucesso.",
          "sucesso"
        );


        setTimeout(
          function() {

            limparMensagem();

          },
          2500
        );

      }


      catch (erro) {

        console.error(
          "Erro ao carregar dados:",
          erro
        );


        mostrarMensagem(
          "Não foi possível conectar ao sistema. " +
          "Verifique se a implantação do Google Apps Script " +
          "está publicada como aplicativo da Web.",
          "erro"
        );

      }


      finally {

        mostrarCarregando(
          false
        );

      }

    }


    /* ======================================================
       PREENCHER SERVIÇOS
       ====================================================== */

    function preencherServicos() {

      servico.innerHTML =
        "";


      const opcao =
        document.createElement(
          "option"
        );

      opcao.value =
        "";

      opcao.textContent =
        "Selecione o serviço";

      servico.appendChild(
        opcao
      );


      servicos.forEach(
        function(item) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            item.nome;


          option.textContent =
            item.nome;


          servico.appendChild(
            option
          );

        }
      );

    }


    /* ======================================================
       PREENCHER PROFISSIONAIS
       ====================================================== */

    function preencherProfissionais() {

      profissional.innerHTML =
        "";


      const opcao =
        document.createElement(
          "option"
        );


      opcao.value =
        "";

      opcao.textContent =
        "Selecione o profissional";

      profissional.appendChild(
        opcao
      );


      profissionais.forEach(
        function(item) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            item.nome;


          option.textContent =
            item.nome;


          profissional.appendChild(
            option
          );

        }
      );

    }


    /* ======================================================
       EVENTOS
       ====================================================== */

    servico.addEventListener(
      "change",
      function() {

        mostrarInformacaoServico();

        carregarHorarios();

      }
    );


    profissional.addEventListener(
      "change",
      function() {

        carregarHorarios();

      }
    );


    data.addEventListener(
      "change",
      function() {

        carregarHorarios();

      }
    );


    btnAgendar.addEventListener(
      "click",
      function() {

        realizarAgendamento();

      }
    );


    /* ======================================================
       INFORMAÇÃO DO SERVIÇO
       ====================================================== */

    function mostrarInformacaoServico() {

      const selecionado =
        servicos.find(
          function(item) {

            return (
              item.nome ===
              servico.value
            );

          }
        );


      if (!selecionado) {

        infoServico.style.display =
          "none";

        infoServico.innerHTML =
          "";

        return;

      }


      const preco =
        Number(
          selecionado.preco || 0
        );


      const duracao =
        Number(
          selecionado.duracao || 0
        );


      infoServico.innerHTML =
        "<strong>" +
        escaparHTML(
          selecionado.nome
        ) +
        "</strong>" +
        "<br>" +
        duracao +
        " minutos" +
        " · " +
        formatarPreco(
          preco
        );


      infoServico.style.display =
        "block";

    }


    /* ======================================================
       CARREGAR HORÁRIOS
       ====================================================== */

    async function carregarHorarios() {

      horaInicio.value =
        "";

      horariosDisponiveis =
        [];

      btnAgendar.disabled =
        true;


      horarios.innerHTML =
        '<div class="horario-indisponivel">' +
        'Selecione serviço, profissional e data.' +
        '</div>';


      if (
        !servico.value ||
        !profissional.value ||
        !data.value
      ) {

        return;

      }


      if (
        !validarDataSelecionada()
      ) {

        return;

      }


      horarios.innerHTML =
        '<div class="horario-indisponivel">' +
        '<span class="spinner"></span>' +
        'Carregando horários...' +
        '</div>';


      try {

        const resposta =
          await chamarAPI({

            acao:
              "horarios",

            servico:
              servico.value,

            profissional:
              profissional.value,

            data:
              data.value

          });


        if (
          !resposta ||
          resposta.sucesso !== true
        ) {

          throw new Error(
            resposta &&
            resposta.mensagem
              ? resposta.mensagem
              : "Não foi possível carregar os horários."
          );

        }


        horariosDisponiveis =
          Array.isArray(
            resposta.horarios
          )
            ? resposta.horarios
            : [];


        renderizarHorarios();

      }


      catch (erro) {

        console.error(
          "Erro ao carregar horários:",
          erro
        );


        horarios.innerHTML =
          '<div class="horario-indisponivel">' +
          'Não foi possível carregar os horários.' +
          '</div>';

      }

    }


    /* ======================================================
       VALIDAR DATA
       ====================================================== */

    function validarDataSelecionada() {

      if (!data.value) {
        return false;
      }


      const hoje =
        new Date();


      hoje.setHours(
        0,
        0,
        0,
        0
      );


      const partes =
        data.value.split("-");


      const selecionada =
        new Date(
          Number(partes[0]),
          Number(partes[1]) - 1,
          Number(partes[2])
        );


      if (
        selecionada < hoje
      ) {

        mostrarMensagem(
          "A data selecionada já passou.",
          "erro"
        );

        return false;

      }


      return true;

    }


    /* ======================================================
       RENDERIZAR HORÁRIOS
       ====================================================== */

    function renderizarHorarios() {

      horarios.innerHTML =
        "";


      if (
        horariosDisponiveis.length === 0
      ) {

        horarios.innerHTML =
          '<div class="horario-indisponivel">' +
          'Nenhum horário disponível para esta data.' +
          '</div>';

        return;

      }


      horariosDisponiveis.forEach(
        function(item) {

          const botao =
            document.createElement(
              "button"
            );


          botao.type =
            "button";


          botao.className =
            "horario";


          botao.textContent =
            item.inicio;


          botao.dataset.hora =
            item.inicio;


          botao.addEventListener(
            "click",
            function() {

              selecionarHorario(
                item.inicio,
                botao
              );

            }
          );


          horarios.appendChild(
            botao
          );

        }
      );

    }


    /* ======================================================
       SELECIONAR HORÁRIO
       ====================================================== */

    function selecionarHorario(
      hora,
      botao
    ) {

      document
        .querySelectorAll(
          ".horario"
        )
        .forEach(
          function(item) {

            item.classList.remove(
              "selecionado"
            );

          }
        );


      botao.classList.add(
        "selecionado"
      );


      horaInicio.value =
        hora;


      atualizarBotao();

    }


    /* ======================================================
       ATUALIZAR BOTÃO
       ====================================================== */

    function atualizarBotao() {

      const pronto =
        cliente.value.trim().length >= 2 &&
        telefone.value.replace(/\D/g, "").length >= 8 &&
        servico.value &&
        profissional.value &&
        data.value &&
        horaInicio.value;


      btnAgendar.disabled =
        !pronto;

    }


    cliente.addEventListener(
      "input",
      atualizarBotao
    );


    telefone.addEventListener(
      "input",
      atualizarBotao
    );


    /* ======================================================
       REALIZAR AGENDAMENTO
       ====================================================== */

    async function realizarAgendamento() {

      limparMensagem();


      const nomeCliente =
        cliente.value.trim();


      const telefoneCliente =
        telefone.value.trim();


      if (
        nomeCliente.length < 2
      ) {

        mostrarMensagem(
          "Digite um nome válido.",
          "erro"
        );

        cliente.focus();

        return;

      }


      if (
        telefoneCliente
          .replace(/\D/g, "")
          .length < 8
      ) {

        mostrarMensagem(
          "Digite um telefone válido.",
          "erro"
        );

        telefone.focus();

        return;

      }


      if (!servico.value) {

        mostrarMensagem(
          "Selecione um serviço.",
          "erro"
        );

        return;

      }


      if (!profissional.value) {

        mostrarMensagem(
          "Selecione um profissional.",
          "erro"
        );

        return;

      }


      if (!data.value) {

        mostrarMensagem(
          "Selecione uma data.",
          "erro"
        );

        return;

      }


      if (!horaInicio.value) {

        mostrarMensagem(
          "Selecione um horário.",
          "erro"
        );

        return;

      }


      btnAgendar.disabled =
        true;


      btnAgendar.textContent =
        "Agendando...";


      mostrarCarregando(
        true
      );


      /*
       * ====================================================
       * IMPORTANTE
       *
       * O backend atual usa doPost().
       *
       * Um POST JSON direto pelo GitHub Pages gera
       * bloqueio CORS.
       *
       * Por isso esta versão envia o agendamento por
       * GET/JSONP através da ação "agendar".
       *
       * O Código.gs precisa possuir a ação "agendar"
       * no doGet.
       * ====================================================
       */

      try {

        const resposta =
          await chamarAPI({

            acao:
              "agendar",

            cliente:
              nomeCliente,

            telefone:
              telefoneCliente,

            servico:
              servico.value,

            profissional:
              profissional.value,

            data:
              data.value,

            horaInicio:
              horaInicio.value

          });


        if (
          !resposta ||
          resposta.sucesso !== true
        ) {

          throw new Error(
            resposta &&
            resposta.mensagem
              ? resposta.mensagem
              : "Não foi possível realizar o agendamento."
          );

        }


        mostrarResumo(
          resposta
        );


        mostrarMensagem(
          resposta.mensagem ||
          "Agendamento realizado com sucesso!",
          "sucesso"
        );


        limparFormularioDepoisSucesso();

      }


      catch (erro) {

        console.error(
          "Erro ao realizar agendamento:",
          erro
        );


        mostrarMensagem(
          erro.message ||
          "Não foi possível realizar o agendamento.",
          "erro"
        );

      }


      finally {

        mostrarCarregando(
          false
        );


        btnAgendar.textContent =
          "Confirmar agendamento";


        atualizarBotao();

      }

    }


    /* ======================================================
       MOSTRAR RESUMO
       ====================================================== */

    function mostrarResumo(
      resposta
    ) {

      document.getElementById(
        "resCliente"
      ).textContent =
        resposta.cliente ||
        cliente.value;


      document.getElementById(
        "resServico"
      ).textContent =
        resposta.servico ||
        servico.value;


      document.getElementById(
        "resProfissional"
      ).textContent =
        resposta.profissional ||
        profissional.value;


      document.getElementById(
        "resData"
      ).textContent =
        resposta.dataBR ||
        formatarDataBR(
          data.value
        );


      document.getElementById(
        "resHora"
      ).textContent =
        resposta.horaInicio
          ? (
              resposta.horaInicio +
              (
                resposta.horaFim
                  ? " - " +
                    resposta.horaFim
                  : ""
              )
            )
          : horaInicio.value;


      document.getElementById(
        "resPreco"
      ).textContent =
        formatarPreco(
          Number(
            resposta.preco ||
            obterPrecoServico()
          )
        );


      document.getElementById(
        "resId"
      ).textContent =
        resposta.id ||
        "Confirmado";


      resumo.style.display =
        "block";


      resumo.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* ======================================================
       LIMPAR FORMULÁRIO
       ====================================================== */

    function limparFormularioDepoisSucesso() {

      cliente.value =
        "";

      telefone.value =
        "";

      servico.value =
        "";

      profissional.value =
        "";

      data.value =
        "";

      horaInicio.value =
        "";


      infoServico.style.display =
        "none";


      infoServico.innerHTML =
        "";


      horariosDisponiveis =
        [];


      horarios.innerHTML =
        '<div class="horario-indisponivel">' +
        'Selecione serviço, profissional e data.' +
        '</div>';


      btnAgendar.disabled =
        true;

    }


    /* ======================================================
       PREÇO DO SERVIÇO
       ====================================================== */

    function obterPrecoServico() {

      const item =
        servicos.find(
          function(servicoItem) {

            return (
              servicoItem.nome ===
              servico.value
            );

          }
        );


      return item
        ? Number(
            item.preco || 0
          )
        : 0;

    }


    /* ======================================================
       FORMATAR PREÇO
       ====================================================== */

    function formatarPreco(
      valor
    ) {

      return Number(
        valor || 0
      ).toLocaleString(
        "pt-BR",
        {
          style: "currency",
          currency: "BRL"
        }
      );

    }


    /* ======================================================
       FORMATAR DATA
       ====================================================== */

    function formatarDataBR(
      valor
    ) {

      if (!valor) {
        return "";
      }


      const partes =
        String(valor)
          .split("-");


      if (
        partes.length !== 3
      ) {

        return valor;

      }


      return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
      );

    }


    /* ======================================================
       MENSAGEM
       ====================================================== */

    function mostrarMensagem(
      texto,
      tipo
    ) {

      mensagem.className =
        "mensagem " +
        (
          tipo === "sucesso"
            ? "sucesso"
            : "erro"
        );


      mensagem.textContent =
        texto;


      mensagem.style.display =
        "block";


      mensagem.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

    }


    function limparMensagem() {

      mensagem.className =
        "mensagem";

      mensagem.textContent =
        "";

      mensagem.style.display =
        "none";

    }


    /* ======================================================
       CARREGANDO
       ====================================================== */

    function mostrarCarregando(
      mostrar
    ) {

      carregando.style.display =
        mostrar
          ? "block"
          : "none";

    }


    /* ======================================================
       ESCAPAR HTML
       ====================================================== */

    function escaparHTML(
      texto
    ) {

      return String(
        texto || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }

  </script>

</body>
