<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Barbearia - Agendamento</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111111,
          #1c1c1c
        );

      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 35px 15px 25px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
      color: #d4af37;
    }

    header p {
      color: #cccccc;
      font-size: 16px;
    }

    .card {
      background: #ffffff;
      color: #222222;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow:
        0 10px 30px rgba(0,0,0,.30);
    }

    .card h2 {
      margin-bottom: 20px;
      color: #111111;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      color: #333333;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 15px;
      background: #fff;
      color: #222;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
      box-shadow:
        0 0 0 3px rgba(212,175,55,.15);
    }

    .horarios {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(100px, 1fr)
        );

      gap: 10px;

      margin-top: 15px;
    }

    .horario {
      border: 2px solid #d4af37;
      background: #fff;
      color: #222;
      border-radius: 10px;
      padding: 12px 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .horario:hover {
      background: #d4af37;
      color: #fff;
    }

    .horario.selecionado {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .sem-horarios {
      color: #777;
      padding: 15px 0;
      text-align: center;
      grid-column: 1 / -1;
    }

    .status {
      display: none;
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.mostrar {
      display: block;
    }

    .status.info {
      background: #eaf3ff;
      color: #17518a;
      border: 1px solid #b9d9ff;
    }

    .status.sucesso {
      background: #e9f9ee;
      color: #176b31;
      border: 1px solid #a9dfb8;
    }

    .status.erro {
      background: #fff0f0;
      color: #a52222;
      border: 1px solid #efb1b1;
    }

    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #d4af37;
      color: #111;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .resumo {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .resumo h3 {
      margin-bottom: 12px;
    }

    .resumo-linha {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      border-bottom: 1px solid #e2e2e2;
    }

    .resumo-linha:last-child {
      border-bottom: 0;
    }

    .oculto {
      display: none !important;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width:700px) {

      header h1 {
        font-size: 27px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .campo.full {
        grid-column: auto;
      }

    }

  </style>

</head>

<body>

<div class="container">

  <header>

    <h1>✂️ Barbearia</h1>

    <p>
      Agende seu horário de forma rápida e fácil
    </p>

  </header>


  <div
    id="status"
    class="status"
  ></div>


  <div class="card">

    <h2>
      Agende seu horário
    </h2>


    <div class="grid">


      <div class="campo">

        <label for="cliente">
          Nome
        </label>

        <input
          type="text"
          id="cliente"
          placeholder="Seu nome"
          autocomplete="name"
        >

      </div>


      <div class="campo">

        <label for="telefone">
          Telefone
        </label>

        <input
          type="tel"
          id="telefone"
          placeholder="(00) 00000-0000"
          autocomplete="tel"
        >

      </div>


      <div class="campo">

        <label for="servico">
          Serviço
        </label>

        <select id="servico">

          <option value="">
            Selecione o serviço
          </option>

          <!--
            Cadastre aqui seus serviços.
            Depois podemos fazer o Code.gs
            carregar automaticamente da planilha.
          -->

          <option value="Corte">
            Corte
          </option>

          <option value="Barba">
            Barba
          </option>

          <option value="Corte + Barba">
            Corte + Barba
          </option>

        </select>

      </div>


      <div class="campo">

        <label for="profissional">
          Profissional
        </label>

        <select id="profissional">

          <option value="">
            Carregando profissionais...
          </option>

        </select>

      </div>


      <div class="campo full">

        <label for="data">
          Data
        </label>

        <input
          type="date"
          id="data"
        >

      </div>

    </div>


    <div
      id="areaHorarios"
      class="oculto"
      style="margin-top:22px;"
    >

      <h3>
        Escolha o horário
      </h3>

      <div
        id="horarios"
        class="horarios"
      ></div>

    </div>


    <div
      id="resumo"
      class="resumo oculto"
    >

      <h3>
        Resumo do agendamento
      </h3>


      <div class="resumo-linha">
        <span>Cliente</span>
        <strong id="resumoCliente">-</strong>
      </div>


      <div class="resumo-linha">
        <span>Telefone</span>
        <strong id="resumoTelefone">-</strong>
      </div>


      <div class="resumo-linha">
        <span>Serviço</span>
        <strong id="resumoServico">-</strong>
      </div>


      <div class="resumo-linha">
        <span>Profissional</span>
        <strong id="resumoProfissional">-</strong>
      </div>


      <div class="resumo-linha">
        <span>Data</span>
        <strong id="resumoData">-</strong>
      </div>


      <div class="resumo-linha">
        <span>Horário</span>
        <strong id="resumoHorario">-</strong>
      </div>

    </div>


    <div style="margin-top:20px;">

      <button
        id="btnAgendar"
        class="btn"
        disabled
      >
        Confirmar agendamento
      </button>

    </div>

  </div>


  <footer>
    Sistema de agendamento da barbearia
  </footer>

</div>


<script>

/************************************************************
 * URL DO GOOGLE APPS SCRIPT
 ************************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbz_cgLSikg8Pvh3Xu6_2aIWybRHjNl9EnYmZ7FWqaJ1OBwhvqhKBpHA-na7adzajFgS/exec";


/************************************************************
 * ESTADO
 ************************************************************/

let profissionais = [];

let agendamentos = [];

let horarioSelecionado = null;


/************************************************************
 * ELEMENTOS
 ************************************************************/

const statusEl =
  document.getElementById("status");

const clienteEl =
  document.getElementById("cliente");

const telefoneEl =
  document.getElementById("telefone");

const servicoEl =
  document.getElementById("servico");

const profissionalEl =
  document.getElementById("profissional");

const dataEl =
  document.getElementById("data");

const areaHorariosEl =
  document.getElementById("areaHorarios");

const horariosEl =
  document.getElementById("horarios");

const resumoEl =
  document.getElementById("resumo");

const btnAgendar =
  document.getElementById("btnAgendar");


/************************************************************
 * INICIALIZAÇÃO
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    configurarData();

    carregarProfissionais();

    configurarEventos();

  }
);


/************************************************************
 * DATA
 ************************************************************/

function configurarData() {

  const hoje =
    new Date();

  const ano =
    hoje.getFullYear();

  const mes =
    String(
      hoje.getMonth() + 1
    ).padStart(2, "0");

  const dia =
    String(
      hoje.getDate()
    ).padStart(2, "0");

  const dataHoje =
    ano +
    "-" +
    mes +
    "-" +
    dia;

  dataEl.min =
    dataHoje;

  dataEl.value =
    dataHoje;

}


/************************************************************
 * EVENTOS
 ************************************************************/

function configurarEventos() {

  profissionalEl.addEventListener(
    "change",
    function() {

      horarioSelecionado = null;

      carregarAgendamentos();

      atualizarResumo();

    }
  );


  dataEl.addEventListener(
    "change",
    function() {

      horarioSelecionado = null;

      carregarAgendamentos();

      atualizarResumo();

    }
  );


  clienteEl.addEventListener(
    "input",
    atualizarResumo
  );


  telefoneEl.addEventListener(
    "input",
    function() {

      aplicarMascaraTelefone();

      atualizarResumo();

    }
  );


  servicoEl.addEventListener(
    "change",
    atualizarResumo
  );


  btnAgendar.addEventListener(
    "click",
    realizarAgendamento
  );

}


/************************************************************
 * CARREGAR PROFISSIONAIS
 *
 * Usa:
 *
 * ?acao=profissionais
 *
 * em vez de:
 *
 * ?acao=dados
 ************************************************************/

function carregarProfissionais() {

  mostrarStatus(
    "Carregando profissionais...",
    "info"
  );


  jsonp(
    "profissionais",
    {},
    function(resposta) {

      console.log(
        "Resposta profissionais:",
        resposta
      );


      if (
        !resposta ||
        resposta.sucesso !== true
      ) {

        throw new Error(
          resposta &&
          resposta.mensagem
            ? resposta.mensagem
            : "Não foi possível carregar os profissionais."
        );

      }


      profissionais =
        Array.isArray(
          resposta.profissionais
        )
          ? resposta.profissionais
          : [];


      preencherProfissionais();


      if (
        profissionais.length === 0
      ) {

        mostrarStatus(
          "Nenhum profissional ativo foi encontrado.",
          "erro"
        );

        return;

      }


      mostrarStatus(
        profissionais.length +
        " profissional(is) carregado(s).",
        "sucesso"
      );

    },
    function(erro) {

      console.error(
        "ERRO PROFISSIONAIS:",
        erro
      );


      mostrarStatus(
        erro.message ||
        "Erro ao carregar profissionais.",
        "erro"
      );

    }
  );

}


/************************************************************
 * PREENCHER PROFISSIONAIS
 ************************************************************/

function preencherProfissionais() {

  profissionalEl.innerHTML = "";


  const primeiraOpcao =
    document.createElement("option");

  primeiraOpcao.value = "";

  primeiraOpcao.textContent =
    profissionais.length
      ? "Selecione um profissional"
      : "Nenhum profissional encontrado";

  profissionalEl.appendChild(
    primeiraOpcao
  );


  profissionais.forEach(
    function(profissional) {

      const nome =
        typeof profissional === "string"
          ? profissional
          : profissional.nome;


      if (!nome) {
        return;
      }


      const option =
        document.createElement("option");

      option.value =
        nome;

      option.textContent =
        nome;

      profissionalEl.appendChild(
        option
      );

    }
  );

}


/************************************************************
 * CARREGAR AGENDAMENTOS
 *
 * Usa a ação existente no Code.gs:
 *
 * ?acao=agendamentos
 ************************************************************/

function carregarAgendamentos() {

  const profissional =
    profissionalEl.value.trim();

  const data =
    dataEl.value.trim();


  if (
    !profissional ||
    !data
  ) {

    esconderHorarios();

    return;

  }


  areaHorariosEl.classList.remove(
    "oculto"
  );


  horariosEl.innerHTML =
    '<div class="sem-horarios">' +
    'Consultando horários...' +
    '</div>';


  jsonp(
    "agendamentos",
    {
      profissional:
        profissional,

      data:
        data
    },
    function(resposta) {

      console.log(
        "Resposta agendamentos:",
        resposta
      );


      if (
        !resposta ||
        resposta.sucesso !== true
      ) {

        throw new Error(
          resposta &&
          resposta.mensagem
            ? resposta.mensagem
            : "Erro ao consultar agendamentos."
        );

      }


      agendamentos =
        Array.isArray(
          resposta.agendamentos
        )
          ? resposta.agendamentos
          : [];


      gerarHorarios();


    },
    function(erro) {

      console.error(
        "ERRO API:",
        erro
      );


      horariosEl.innerHTML =
        '<div class="sem-horarios">' +
        escapeHtml(
          erro.message ||
          "Erro ao consultar agendamentos."
        ) +
        '</div>';

    }
  );

}


/************************************************************
 * GERAR HORÁRIOS
 *
 * CONFIGURAÇÃO PADRÃO
 *
 * Você pode alterar estes valores.
 ************************************************************/

function gerarHorarios() {

  horariosEl.innerHTML = "";


  /*
   * Horário de funcionamento.
   *
   * Altere aqui se necessário.
   */

  const inicio =
    9 * 60;

  const fim =
    18 * 60;


  /*
   * Intervalo de 30 minutos.
   */

  const intervalo =
    30;


  const ocupados =
    new Set();


  agendamentos.forEach(
    function(item) {

      if (
        item &&
        item.horaInicio
      ) {

        ocupados.add(
          normalizarHora(
            item.horaInicio
          )
        );

      }

    }
  );


  let encontrou =
    false;


  for (
    let minutos = inicio;
    minutos < fim;
    minutos += intervalo
  ) {

    const hora =
      minutosParaHora(
        minutos
      );


    if (
      ocupados.has(hora)
    ) {

      continue;

    }


    encontrou =
      true;


    const botao =
      document.createElement("button");

    botao.type =
      "button";

    botao.className =
      "horario";

    botao.textContent =
      hora;


    botao.addEventListener(
      "click",
      function() {

        document
          .querySelectorAll(
            ".horario"
          )
          .forEach(
            function(item) {

              item.classList.remove(
                "selecionado"
              );

            }
          );


        botao.classList.add(
          "selecionado"
        );


        horarioSelecionado =
          hora;


        atualizarResumo();

      }
    );


    horariosEl.appendChild(
      botao
    );

  }


  if (!encontrou) {

    horariosEl.innerHTML =
      '<div class="sem-horarios">' +
      'Nenhum horário disponível para esta data.' +
      '</div>';

  }

}


/************************************************************
 * CONVERTER MINUTOS PARA HORA
 ************************************************************/

function minutosParaHora(
  minutos
) {

  const hora =
    Math.floor(
      minutos / 60
    );

  const minuto =
    minutos % 60;


  return (
    String(hora).padStart(2, "0") +
    ":" +
    String(minuto).padStart(2, "0")
  );

}


/************************************************************
 * NORMALIZAR HORA
 ************************************************************/

function normalizarHora(
  valor
) {

  const texto =
    String(
      valor || ""
    ).trim();


  const match =
    texto.match(
      /(\d{1,2}):(\d{2})/
    );


  if (!match) {
    return "";
  }


  return (
    String(
      match[1]
    ).padStart(2, "0") +
    ":" +
    match[2]
  );

}


/************************************************************
 * ESCONDER HORÁRIOS
 ************************************************************/

function esconderHorarios() {

  areaHorariosEl.classList.add(
    "oculto"
  );

  horariosEl.innerHTML =
    "";

}


/************************************************************
 * RESUMO
 ************************************************************/

function atualizarResumo() {

  document.getElementById(
    "resumoCliente"
  ).textContent =
    clienteEl.value.trim() || "-";


  document.getElementById(
    "resumoTelefone"
  ).textContent =
    telefoneEl.value.trim() || "-";


  document.getElementById(
    "resumoServico"
  ).textContent =
    servicoEl.value.trim() || "-";


  document.getElementById(
    "resumoProfissional"
  ).textContent =
    profissionalEl.value.trim() || "-";


  document.getElementById(
    "resumoData"
  ).textContent =
    dataEl.value
      ? formatarDataBR(
          dataEl.value
        )
      : "-";


  document.getElementById(
    "resumoHorario"
  ).textContent =
    horarioSelecionado ||
    "-";


  const podeAgendar =
    clienteEl.value.trim().length >= 2 &&
    telefoneEl.value.replace(/\D/g, "").length >= 8 &&
    servicoEl.value.trim() &&
    profissionalEl.value.trim() &&
    dataEl.value.trim() &&
    horarioSelecionado;


  btnAgendar.disabled =
    !podeAgendar;


  if (podeAgendar) {

    resumoEl.classList.remove(
      "oculto"
    );

  } else {

    resumoEl.classList.add(
      "oculto"
    );

  }

}


/************************************************************
 * AGENDAR
 *
 * ATENÇÃO:
 *
 * O Code.gs que você enviou ainda NÃO possui
 * a ação "agendar".
 *
 * Portanto, aqui mostramos uma mensagem clara
 * em vez de gerar erro silencioso.
 ************************************************************/

function realizarAgendamento() {

  mostrarStatus(
    "A função de gravação do agendamento ainda precisa ser adicionada ao Code.gs.",
    "erro"
  );

}


/************************************************************
 * JSONP
 ************************************************************/

function jsonp(
  acao,
  parametros,
  sucesso,
  falha
) {

  const callbackName =
    "__barbearia_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      "script"
    );


  let finalizado =
    false;


  const timeout =
    setTimeout(
      function() {

        finalizar(
          new Error(
            "O Google Apps Script não respondeu."
          )
        );

      },
      20000
    );


  window[callbackName] =
    function(resposta) {

      if (finalizado) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      limpar();


      try {

        sucesso(
          resposta
        );

      }

      catch (erro) {

        if (falha) {
          falha(erro);
        }

      }

    };


  script.onerror =
    function() {

      finalizar(
        new Error(
          "Não foi possível conectar ao Google Apps Script."
        )
      );

    };


  function finalizar(
    erro
  ) {

    if (finalizado) {
      return;
    }


    finalizado =
      true;


    clearTimeout(
      timeout
    );


    limpar();


    if (falha) {
      falha(erro);
    }

  }


  function limpar() {

    delete window[
      callbackName
    ];


    if (
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  const query =
    new URLSearchParams();


  query.set(
    "acao",
    acao
  );


  query.set(
    "callback",
    callbackName
  );


  Object.keys(
    parametros || {}
  ).forEach(
    function(chave) {

      const valor =
        parametros[chave];


      if (
        valor !== undefined &&
        valor !== null
      ) {

        query.set(
          chave,
          String(valor)
        );

      }

    }
  );


  script.src =
    API_URL +
    "?" +
    query.toString();


  script.async =
    true;


  document.head.appendChild(
    script
  );

}


/************************************************************
 * STATUS
 ************************************************************/

function mostrarStatus(
  mensagem,
  tipo
) {

  statusEl.className =
    "status mostrar " +
    (
      tipo ||
      "info"
    );


  statusEl.innerHTML =
    escapeHtml(
      mensagem
    );

}


/************************************************************
 * DATA BR
 ************************************************************/

function formatarDataBR(
  data
) {

  const partes =
    String(
      data || ""
    ).split("-");


  if (
    partes.length !== 3
  ) {

    return data;

  }


  return (
    partes[2] +
    "/" +
    partes[1] +
    "/" +
    partes[0]
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  valor
) {

  return String(
    valor === null ||
    valor === undefined
      ? ""
      : valor
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/************************************************************
 * MÁSCARA TELEFONE
 ************************************************************/

function aplicarMascaraTelefone() {

  let valor =
    telefoneEl.value
      .replace(
        /\D/g,
        ""
      )
      .substring(
        0,
        11
      );


  if (
    valor.length <= 10
  ) {

    valor =
      valor.replace(
        /^(\d{2})(\d)/,
        "($1) $2"
      );

    valor =
      valor.replace(
        /(\d{4})(\d)/,
        "$1-$2"
      );

  } else {

    valor =
      valor.replace(
        /^(\d{2})(\d)/,
        "($1) $2"
      );

    valor =
      valor.replace(
        /(\d{5})(\d)/,
        "$1-$2"
      );

  }


  telefoneEl.value =
    valor;

}

</script>
