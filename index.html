<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Barbearia - Agendamento</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #111111,
          #1c1c1c
        );

      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 35px 15px 25px;
    }

    header h1 {
      font-size: 34px;
      margin-bottom: 8px;
      color: #d4af37;
    }

    header p {
      color: #cccccc;
      font-size: 16px;
    }

    .card {
      background: #ffffff;
      color: #222222;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.30);
    }

    .card h2 {
      margin-bottom: 20px;
      color: #111111;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .campo.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      color: #333333;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      padding: 0 13px;
      font-size: 15px;
      background: #ffffff;
      color: #222222;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d4af37;
      box-shadow:
        0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .horarios {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(100px, 1fr)
        );

      gap: 10px;

      margin-top: 15px;
    }

    .horario {
      border: 2px solid #d4af37;
      background: #ffffff;
      color: #222222;
      border-radius: 10px;
      padding: 12px 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .horario:hover {
      background: #d4af37;
      color: #ffffff;
    }

    .horario.selecionado {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    .sem-horarios {
      color: #777777;
      padding: 15px 0;
      text-align: center;
    }

    .status {
      display: none;
      border-radius: 10px;
      padding: 13px 15px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.mostrar {
      display: block;
    }

    .status.info {
      background: #eaf3ff;
      color: #17518a;
      border: 1px solid #b9d9ff;
    }

    .status.sucesso {
      background: #e9f9ee;
      color: #176b31;
      border: 1px solid #a9dfb8;
    }

    .status.erro {
      background: #fff0f0;
      color: #a52222;
      border: 1px solid #efb1b1;
    }

    .btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: #d4af37;
      color: #111111;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .resumo {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .resumo h3 {
      margin-bottom: 12px;
    }

    .resumo-linha {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      border-bottom: 1px solid #e2e2e2;
    }

    .resumo-linha:last-child {
      border-bottom: 0;
    }

    .resumo-linha strong {
      color: #111111;
    }

    .carregando {
      color: #777777;
      font-size: 14px;
    }

    .oculto {
      display: none !important;
    }

    footer {
      text-align: center;
      color: #999999;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 700px) {

      header h1 {
        font-size: 27px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .campo.full {
        grid-column: auto;
      }

      .horarios {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

    @media (max-width: 400px) {

      .horarios {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>✂️ Barbearia</h1>
      <p>Agende seu horário de forma rápida e fácil</p>
    </header>


    <!-- STATUS -->
    <div
      id="status"
      class="status"
    ></div>


    <!-- AGENDAMENTO -->
    <div class="card">

      <h2>Agende seu horário</h2>

      <div class="grid">

        <!-- CLIENTE -->
        <div class="campo">

          <label for="cliente">
            Nome
          </label>

          <input
            type="text"
            id="cliente"
            placeholder="Seu nome"
            autocomplete="name"
          >

        </div>


        <!-- TELEFONE -->
        <div class="campo">

          <label for="telefone">
            Telefone
          </label>

          <input
            type="tel"
            id="telefone"
            placeholder="(00) 00000-0000"
            autocomplete="tel"
          >

        </div>


        <!-- SERVIÇO -->
        <div class="campo">

          <label for="servico">
            Serviço
          </label>

          <select id="servico">

            <option value="">
              Carregando serviços...
            </option>

          </select>

        </div>


        <!-- PROFISSIONAL -->
        <div class="campo">

          <label for="profissional">
            Profissional
          </label>

          <select id="profissional">

            <option value="">
              Carregando profissionais...
            </option>

          </select>

        </div>


        <!-- DATA -->
        <div class="campo full">

          <label for="data">
            Data
          </label>

          <input
            type="date"
            id="data"
          >

        </div>

      </div>


      <!-- HORÁRIOS -->
      <div
        id="areaHorarios"
        class="oculto"
        style="margin-top: 22px;"
      >

        <h3>
          Escolha o horário
        </h3>

        <div
          id="horarios"
          class="horarios"
        ></div>

      </div>


      <!-- RESUMO -->
      <div
        id="resumo"
        class="resumo oculto"
      >

        <h3>
          Resumo do agendamento
        </h3>

        <div class="resumo-linha">
          <span>Cliente</span>
          <strong id="resumoCliente">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Telefone</span>
          <strong id="resumoTelefone">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Serviço</span>
          <strong id="resumoServico">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Profissional</span>
          <strong id="resumoProfissional">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Data</span>
          <strong id="resumoData">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Horário</span>
          <strong id="resumoHorario">-</strong>
        </div>

        <div class="resumo-linha">
          <span>Valor</span>
          <strong id="resumoPreco">-</strong>
        </div>

      </div>


      <!-- BOTÃO -->
      <div style="margin-top: 20px;">

        <button
          id="btnAgendar"
          class="btn"
          disabled
        >
          Confirmar agendamento
        </button>

      </div>

    </div>


    <footer>
      Sistema de agendamento da barbearia
    </footer>

  </div>


  <script>

    /********************************************************
     * CONFIGURAÇÃO DA API
     ********************************************************/

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyaDcSCmCyR-LHK9N-r2vy3LKQgS6a5IOuezNBb_MBw4ncglSRdPN5efiDvvzP-kSab/exec";


    /********************************************************
     * ESTADO
     ********************************************************/

    let dadosSistema = {

      servicos: [],

      profissionais: []

    };


    let horarioSelecionado = null;


    let carregandoHorarios = false;


    /********************************************************
     * ELEMENTOS
     ********************************************************/

    const statusEl =
      document.getElementById("status");

    const clienteEl =
      document.getElementById("cliente");

    const telefoneEl =
      document.getElementById("telefone");

    const servicoEl =
      document.getElementById("servico");

    const profissionalEl =
      document.getElementById("profissional");

    const dataEl =
      document.getElementById("data");

    const areaHorariosEl =
      document.getElementById("areaHorarios");

    const horariosEl =
      document.getElementById("horarios");

    const resumoEl =
      document.getElementById("resumo");

    const btnAgendar =
      document.getElementById("btnAgendar");


    /********************************************************
     * INICIALIZAÇÃO
     ********************************************************/

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        configurarDataMinima();

        configurarEventos();

        carregarDados();

      }
    );


    /********************************************************
     * DATA MÍNIMA
     ********************************************************/

    function configurarDataMinima() {

      const hoje =
        new Date();

      const ano =
        hoje.getFullYear();

      const mes =
        String(
          hoje.getMonth() + 1
        ).padStart(
          2,
          "0"
        );

      const dia =
        String(
          hoje.getDate()
        ).padStart(
          2,
          "0"
        );

      dataEl.min =
        ano + "-" +
        mes + "-" +
        dia;

    }


    /********************************************************
     * EVENTOS
     ********************************************************/

    function configurarEventos() {

      servicoEl.addEventListener(
        "change",
        function() {

          limparHorario();

          atualizarResumo();

          verificarHorarios();

        }
      );


      profissionalEl.addEventListener(
        "change",
        function() {

          limparHorario();

          atualizarResumo();

          verificarHorarios();

        }
      );


      dataEl.addEventListener(
        "change",
        function() {

          limparHorario();

          atualizarResumo();

          verificarHorarios();

        }
      );


      clienteEl.addEventListener(
        "input",
        atualizarResumo
      );


      telefoneEl.addEventListener(
        "input",
        atualizarResumo
      );


      btnAgendar.addEventListener(
        "click",
        realizarAgendamento
      );

    }


    /********************************************************
     * CARREGAR DADOS
     ********************************************************/

    function carregarDados() {

      mostrarStatus(
        "Carregando serviços e profissionais...",
        "info"
      );


      jsonp(
        "dados",
        {},
        function(resposta) {

          if (
            !resposta ||
            resposta.sucesso !== true
          ) {

            throw new Error(
              resposta &&
              resposta.mensagem
                ? resposta.mensagem
                : "Não foi possível carregar os dados."
            );

          }


          dadosSistema.servicos =
            Array.isArray(
              resposta.servicos
            )
              ? resposta.servicos
              : [];


          dadosSistema.profissionais =
            Array.isArray(
              resposta.profissionais
            )
              ? resposta.profissionais
              : [];


          preencherServicos();

          preencherProfissionais();


          if (
            dadosSistema.servicos.length === 0 &&
            dadosSistema.profissionais.length === 0
          ) {

            mostrarStatus(
              "A API respondeu, mas não existem serviços ou profissionais cadastrados na planilha.",
              "erro"
            );

            return;

          }


          mostrarStatus(
            "Serviços e profissionais carregados.",
            "sucesso"
          );

        }
      );

    }


    /********************************************************
     * PREENCHER SERVIÇOS
     ********************************************************/

    function preencherServicos() {

      servicoEl.innerHTML = "";

      const opcaoInicial =
        document.createElement("option");

      opcaoInicial.value = "";

      opcaoInicial.textContent =
        dadosSistema.servicos.length
          ? "Selecione um serviço"
          : "Nenhum serviço cadastrado";

      servicoEl.appendChild(
        opcaoInicial
      );


      dadosSistema.servicos.forEach(
        function(servico) {

          const option =
            document.createElement("option");

          option.value =
            servico.nome || "";

          let texto =
            servico.nome || "Serviço";

          if (
            servico.preco !== undefined &&
            servico.preco !== null
          ) {

            const preco =
              Number(
                servico.preco
              );

            if (
              !isNaN(preco) &&
              preco > 0
            ) {

              texto +=
                " - " +
                formatarMoeda(preco);

            }

          }


          if (
            servico.duracao
          ) {

            texto +=
              " (" +
              servico.duracao +
              " min)";

          }


          option.textContent =
            texto;

          servicoEl.appendChild(
            option
          );

        }
      );

    }


    /********************************************************
     * PREENCHER PROFISSIONAIS
     ********************************************************/

    function preencherProfissionais() {

      profissionalEl.innerHTML = "";

      const opcaoInicial =
        document.createElement("option");

      opcaoInicial.value = "";

      opcaoInicial.textContent =
        dadosSistema.profissionais.length
          ? "Selecione um profissional"
          : "Nenhum profissional cadastrado";

      profissionalEl.appendChild(
        opcaoInicial
      );


      dadosSistema.profissionais.forEach(
        function(profissional) {

          const nome =
            typeof profissional === "string"
              ? profissional
              : profissional.nome;


          if (!nome) {
            return;
          }


          const option =
            document.createElement("option");

          option.value =
            nome;

          option.textContent =
            nome;

          profissionalEl.appendChild(
            option
          );

        }
      );

    }


    /********************************************************
     * VERIFICAR HORÁRIOS
     ********************************************************/

    function verificarHorarios() {

      const servico =
        servicoEl.value.trim();

      const profissional =
        profissionalEl.value.trim();

      const data =
        dataEl.value.trim();


      if (
        !servico ||
        !profissional ||
        !data
      ) {

        esconderHorarios();

        return;

      }


      carregarHorarios(
        servico,
        profissional,
        data
      );

    }


    /********************************************************
     * CARREGAR HORÁRIOS
     ********************************************************/

    function carregarHorarios(
      servico,
      profissional,
      data
    ) {

      if (carregandoHorarios) {
        return;
      }


      carregandoHorarios =
        true;


      areaHorariosEl.classList.remove(
        "oculto"
      );


      horariosEl.innerHTML =
        '<div class="sem-horarios">' +
        'Carregando horários...' +
        '</div>';


      jsonp(
        "horarios",
        {
          servico: servico,
          profissional: profissional,
          data: data
        },
        function(resposta) {

          carregandoHorarios =
            false;


          if (
            !resposta ||
            resposta.sucesso !== true
          ) {

            horariosEl.innerHTML =
              '<div class="sem-horarios">' +
              escapeHtml(
                resposta &&
                resposta.mensagem
                  ? resposta.mensagem
                  : "Erro ao carregar horários."
              ) +
              '</div>';

            return;

          }


          renderizarHorarios(
            resposta.horarios || []
          );

        },
        function(erro) {

          carregandoHorarios =
            false;


          horariosEl.innerHTML =
            '<div class="sem-horarios">' +
            escapeHtml(
              erro.message ||
              "Erro ao consultar a API."
            ) +
            '</div>';

        }
      );

    }


    /********************************************************
     * RENDERIZAR HORÁRIOS
     ********************************************************/

    function renderizarHorarios(
      horarios
    ) {

      horariosEl.innerHTML = "";


      if (
        !Array.isArray(horarios) ||
        horarios.length === 0
      ) {

        horariosEl.innerHTML =
          '<div class="sem-horarios">' +
          'Nenhum horário disponível para esta data.' +
          '</div>';

        return;

      }


      horarios.forEach(
        function(horario) {

          const inicio =
            horario.inicio || "";

          const fim =
            horario.fim || "";


          if (!inicio) {
            return;
          }


          const botao =
            document.createElement("button");

          botao.type =
            "button";

          botao.className =
            "horario";

          botao.dataset.hora =
            inicio;

          botao.textContent =
            fim
              ? inicio + " - " + fim
              : inicio;


          botao.addEventListener(
            "click",
            function() {

              selecionarHorario(
                botao,
                inicio,
                fim
              );

            }
          );


          horariosEl.appendChild(
            botao
          );

        }
      );

    }


    /********************************************************
     * SELECIONAR HORÁRIO
     ********************************************************/

    function selecionarHorario(
      botao,
      inicio,
      fim
    ) {

      document
        .querySelectorAll(
          ".horario"
        )
        .forEach(
          function(item) {

            item.classList.remove(
              "selecionado"
            );

          }
        );


      botao.classList.add(
        "selecionado"
      );


      horarioSelecionado = {

        inicio: inicio,

        fim: fim

      };


      atualizarResumo();

    }


    /********************************************************
     * LIMPAR HORÁRIO
     ********************************************************/

    function limparHorario() {

      horarioSelecionado =
        null;


      document
        .querySelectorAll(
          ".horario"
        )
        .forEach(
          function(item) {

            item.classList.remove(
              "selecionado"
            );

          }
        );


      atualizarResumo();

    }


    /********************************************************
     * ESCONDER HORÁRIOS
     ********************************************************/

    function esconderHorarios() {

      areaHorariosEl.classList.add(
        "oculto"
      );

      horariosEl.innerHTML =
        "";

      horarioSelecionado =
        null;

    }


    /********************************************************
     * ATUALIZAR RESUMO
     ********************************************************/

    function atualizarResumo() {

      const cliente =
        clienteEl.value.trim();

      const telefone =
        telefoneEl.value.trim();

      const servico =
        servicoEl.value.trim();

      const profissional =
        profissionalEl.value.trim();

      const data =
        dataEl.value.trim();


      document.getElementById(
        "resumoCliente"
      ).textContent =
        cliente || "-";


      document.getElementById(
        "resumoTelefone"
      ).textContent =
        telefone || "-";


      document.getElementById(
        "resumoServico"
      ).textContent =
        servico || "-";


      document.getElementById(
        "resumoProfissional"
      ).textContent =
        profissional || "-";


      document.getElementById(
        "resumoData"
      ).textContent =
        data
          ? formatarDataBR(data)
          : "-";


      document.getElementById(
        "resumoHorario"
      ).textContent =
        horarioSelecionado
          ? (
              horarioSelecionado.inicio +
              (
                horarioSelecionado.fim
                  ? " - " +
                    horarioSelecionado.fim
                  : ""
              )
            )
          : "-";


      const servicoObj =
        encontrarServico(
          servico
        );


      if (
        servicoObj &&
        servicoObj.preco !== undefined
      ) {

        document.getElementById(
          "resumoPreco"
        ).textContent =
          formatarMoeda(
            Number(
              servicoObj.preco
            ) || 0
          );

      } else {

        document.getElementById(
          "resumoPreco"
        ).textContent =
          "-";

      }


      const podeAgendar =
        cliente.length >= 2 &&
        telefone.replace(/\D/g, "").length >= 8 &&
        servico &&
        profissional &&
        data &&
        horarioSelecionado;


      btnAgendar.disabled =
        !podeAgendar;


      if (podeAgendar) {

        resumoEl.classList.remove(
          "oculto"
        );

      } else {

        resumoEl.classList.add(
          "oculto"
        );

      }

    }


    /********************************************************
     * REALIZAR AGENDAMENTO
     ********************************************************/

    function realizarAgendamento() {

      if (
        btnAgendar.disabled
      ) {

        return;

      }


      const cliente =
        clienteEl.value.trim();

      const telefone =
        telefoneEl.value.trim();

      const servico =
        servicoEl.value.trim();

      const profissional =
        profissionalEl.value.trim();

      const data =
        dataEl.value.trim();

      const horaInicio =
        horarioSelecionado.inicio;


      btnAgendar.disabled =
        true;

      btnAgendar.textContent =
        "Agendando...";


      mostrarStatus(
        "Enviando seu agendamento...",
        "info"
      );


      jsonp(
        "agendar",
        {
          cliente: cliente,
          telefone: telefone,
          servico: servico,
          profissional: profissional,
          data: data,
          horaInicio: horaInicio
        },
        function(resposta) {

          if (
            !resposta ||
            resposta.sucesso !== true
          ) {

            throw new Error(
              resposta &&
              resposta.mensagem
                ? resposta.mensagem
                : "Não foi possível realizar o agendamento."
            );

          }


          mostrarStatus(
            montarMensagemSucesso(
              resposta
            ),
            "sucesso"
          );


          btnAgendar.textContent =
            "Agendamento confirmado";


          limparFormulario();

        },
        function(erro) {

          btnAgendar.disabled =
            false;

          btnAgendar.textContent =
            "Confirmar agendamento";


          mostrarStatus(
            erro.message ||
            "Não foi possível realizar o agendamento.",
            "erro"
          );

        }
      );

    }


    /********************************************************
     * MENSAGEM DE SUCESSO
     ********************************************************/

    function montarMensagemSucesso(
      resposta
    ) {

      let mensagem =
        "Agendamento realizado com sucesso!";


      if (resposta.id) {

        mensagem +=
          "<br><strong>Protocolo:</strong> " +
          escapeHtml(
            resposta.id
          );

      }


      if (resposta.dataBR) {

        mensagem +=
          "<br><strong>Data:</strong> " +
          escapeHtml(
            resposta.dataBR
          );

      }


      if (resposta.horaInicio) {

        mensagem +=
          "<br><strong>Horário:</strong> " +
          escapeHtml(
            resposta.horaInicio
          );

      }


      return mensagem;

    }


    /********************************************************
     * LIMPAR FORMULÁRIO
     ********************************************************/

    function limparFormulario() {

      clienteEl.value =
        "";

      telefoneEl.value =
        "";

      servicoEl.value =
        "";

      profissionalEl.value =
        "";

      dataEl.value =
        "";

      horarioSelecionado =
        null;


      esconderHorarios();


      atualizarResumo();


      setTimeout(
        function() {

          btnAgendar.disabled =
            true;

          btnAgendar.textContent =
            "Confirmar agendamento";

        },
        1500
      );

    }


    /********************************************************
     * JSONP
     *
     * IMPORTANTE:
     *
     * Não usamos fetch().
     *
     * O Google Apps Script devolve:
     *
     * callback({...});
     *
     * O script é carregado pelo navegador
     * através de uma tag <script>.
     ********************************************************/

    function jsonp(
      acao,
      parametros,
      sucesso,
      falha
    ) {

      const callbackName =
        "__barbearia_callback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      let finalizado =
        false;


      const timeout =
        setTimeout(
          function() {

            finalizar(
              new Error(
                "O Google Apps Script não respondeu. Verifique se a implantação está publicada como aplicativo da Web."
              )
            );

          },
          20000
        );


      window[callbackName] =
        function(resposta) {

          if (finalizado) {
            return;
          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          limpar();


          try {

            if (
              typeof sucesso ===
              "function"
            ) {

              sucesso(
                resposta
              );

            }

          }

          catch (erro) {

            if (
              typeof falha ===
              "function"
            ) {

              falha(
                erro
              );

            } else {

              mostrarStatus(
                erro.message,
                "erro"
              );

            }

          }

        };


      script.onerror =
        function() {

          finalizar(
            new Error(
              "Não foi possível conectar ao Google Apps Script."
            )
          );

        };


      function finalizar(
        erro
      ) {

        if (finalizado) {
          return;
        }


        finalizado =
          true;


        clearTimeout(
          timeout
        );


        limpar();


        if (
          typeof falha ===
          "function"
        ) {

          falha(
            erro
          );

        } else {

          mostrarStatus(
            erro.message,
            "erro"
          );

        }

      }


      function limpar() {

        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      const query =
        new URLSearchParams();


      query.set(
        "acao",
        acao
      );


      query.set(
        "callback",
        callbackName
      );


      Object.keys(
        parametros || {}
      ).forEach(
        function(chave) {

          const valor =
            parametros[chave];


          if (
            valor !== undefined &&
            valor !== null
          ) {

            query.set(
              chave,
              String(valor)
            );

          }

        }
      );


      script.src =
        API_URL +
        "?" +
        query.toString();


      script.async =
        true;


      document.head.appendChild(
        script
      );

    }


    /********************************************************
     * STATUS
     ********************************************************/

    function mostrarStatus(
      mensagem,
      tipo
    ) {

      statusEl.className =
        "status mostrar " +
        (
          tipo || "info"
        );


      statusEl.innerHTML =
        mensagem;

    }


    /********************************************************
     * ENCONTRAR SERVIÇO
     ********************************************************/

    function encontrarServico(
      nome
    ) {

      const procurado =
        normalizarTexto(
          nome
        );


      return (
        dadosSistema.servicos.find(
          function(servico) {

            return (
              normalizarTexto(
                servico.nome
              ) ===
              procurado
            );

          }
        ) ||
        null
      );

    }


    /********************************************************
     * NORMALIZAR TEXTO
     ********************************************************/

    function normalizarTexto(
      texto
    ) {

      return String(
        texto || ""
      )
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /\s+/g,
          " "
        );

    }


    /********************************************************
     * MOEDA
     ********************************************************/

    function formatarMoeda(
      valor
    ) {

      return Number(
        valor || 0
      ).toLocaleString(
        "pt-BR",
        {
          style: "currency",
          currency: "BRL"
        }
      );

    }


    /********************************************************
     * DATA BR
     ********************************************************/

    function formatarDataBR(
      data
    ) {

      const partes =
        String(
          data || ""
        ).split("-");


      if (
        partes.length !== 3
      ) {

        return data;

      }


      return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
      );

    }


    /********************************************************
     * ESCAPE HTML
     ********************************************************/

    function escapeHtml(
      valor
    ) {

      return String(
        valor || ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /********************************************************
     * MÁSCARA DE TELEFONE
     ********************************************************/

    telefoneEl.addEventListener(
      "input",
      function() {

        let valor =
          telefoneEl.value
            .replace(
              /\D/g,
              ""
            )
            .substring(
              0,
              11
            );


        if (
          valor.length <= 10
        ) {

          valor =
            valor.replace(
              /^(\d{2})(\d)/,
              "($1) $2"
            );

          valor =
            valor.replace(
              /(\d{4})(\d)/,
              "$1-$2"
            );

        } else {

          valor =
            valor.replace(
              /^(\d{2})(\d)/,
              "($1) $2"
            );

          valor =
            valor.replace(
              /(\d{5})(\d)/,
              "$1-$2"
            );

        }


        telefoneEl.value =
          valor;

      }
    );

  </script>
